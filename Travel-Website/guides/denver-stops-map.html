<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Denver — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 2,
        "name": "Denver Union Station",
        "query": "Denver Union Station 1701 Wynkoop St Denver",
        "lat": 39.75363,
        "lng": -105.0007481
    },
    {
        "day": 2,
        "name": "Colorado State Capitol",
        "query": "Colorado State Capitol 200 E Colfax Ave Denver",
        "lat": 39.7377065,
        "lng": -104.9853063
    },
    {
        "day": 2,
        "name": "Denver Art Museum",
        "query": "Denver Art Museum 100 W 14th Ave Pkwy Denver",
        "lat": 39.7373941,
        "lng": -104.9896237
    },
    {
        "day": 1,
        "name": "Red Rocks Park &amp; Amphitheatre",
        "query": "Red Rocks Amphitheatre 18300 W Alameda Pkwy Morrison",
        "lat": 39.6653917,
        "lng": -105.2057171
    },
    {
        "day": 3,
        "name": "Denver Botanic Gardens",
        "query": "Denver Botanic Gardens 1007 York St Denver",
        "lat": 39.7326743,
        "lng": -104.960632
    },
    {
        "day": 2,
        "name": "Molly Brown House Museum",
        "query": "Molly Brown House Museum 1340 Pennsylvania St Denver",
        "lat": 39.73751,
        "lng": -104.9807688
    },
    {
        "day": 3,
        "name": "Denver Museum of Nature &amp; Science",
        "query": "Denver Museum of Nature and Science 2001 Colorado Blvd Denver",
        "lat": 39.7475479,
        "lng": -104.9429113
    },
    {
        "day": 1,
        "name": "Golden",
        "query": "Washington Avenue Downtown Golden Colorado",
        "lat": 39.7426201,
        "lng": -105.1643181
    },
    {
        "day": 1,
        "name": "Buffalo Bill Museum &amp; Grave",
        "query": "Buffalo Bill Museum and Grave 987 1/2 Lookout Mountain Rd Golden",
        "lat": 39.733469,
        "lng": -105.2385152
    },
    {
        "day": 1,
        "name": "Dinosaur Ridge",
        "query": "Dinosaur Ridge 16831 W Alameda Pkwy Morrison",
        "lat": 39.688889,
        "lng": -105.190555
    },
    {
        "day": 4,
        "name": "The Denver Mint",
        "query": "United States Mint 320 W Colfax Ave Denver",
        "lat": 39.7392,
        "lng": -104.9919
    },
    {
        "day": 4,
        "name": "Larimer Square",
        "query": "Larimer Square 1400 Larimer St Denver",
        "lat": 39.7432,
        "lng": -104.9997
    },
    {
        "day": 4,
        "name": "Washington Park",
        "query": "Washington Park 701 S Franklin St Denver",
        "lat": 39.7083,
        "lng": -104.9675
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
