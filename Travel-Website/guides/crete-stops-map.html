<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>Crete — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Crete — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#8b5cf6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#10b981">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=111"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Palace of Knossos",
        "query": "Palace of Knossos Heraklion Crete Greece",
        "lat": 35.2980733,
        "lng": 25.161437
    },
    {
        "day": 1,
        "name": "Archaeological Museum of Heraklion",
        "query": "Heraklion Archaeological Museum Xanthoudidou 2 Heraklion Crete",
        "lat": 35.3391377,
        "lng": 25.1374187
    },
    {
        "day": 1,
        "name": "Koules Fortress",
        "query": "Koules Fortress Old Venetian Port Heraklion Crete",
        "lat": 35.3428096,
        "lng": 25.1343019
    },
    {
        "day": 1,
        "name": "Historical Museum of Crete",
        "query": "Historical Museum of Crete Lyssimachou Kalokerinou 27 Heraklion",
        "lat": 35.3418379,
        "lng": 25.130944
    },
    {
        "day": 2,
        "name": "Palace of Malia",
        "query": "Palace of Malia Archaeological Site Malia Crete",
        "lat": 35.2844389,
        "lng": 25.4699528
    },
    {
        "day": 2,
        "name": "Lake Voulismeni",
        "query": "Lake Voulismeni Agios Nikolaos Crete",
        "lat": 35.1905668,
        "lng": 25.7174715
    },
    {
        "day": 2,
        "name": "Spinalonga Island",
        "query": "Spinalonga Island Gulf of Elounda Lasithi Crete",
        "lat": 35.2726763,
        "lng": 25.7471909
    },
    {
        "day": 2,
        "name": "Church of Panagia Kera",
        "query": "Church of Panagia Kera Kritsa Lasithi Crete",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Gortyna",
        "query": "Ancient Gortyna Gortys Heraklion Regional Unit Crete",
        "lat": 35.0570427,
        "lng": 24.9447947
    },
    {
        "day": 3,
        "name": "Phaistos",
        "query": "Phaistos Archaeological Site Phaistos Crete",
        "lat": 35.0517066,
        "lng": 24.8148553
    },
    {
        "day": 3,
        "name": "Agia Triada",
        "query": "Agia Triada Archaeological Site Crete",
        "lat": 35.0593323,
        "lng": 24.7931579
    },
    {
        "day": 3,
        "name": "Matala",
        "query": "Matala southwest coast Crete",
        "lat": 34.9925331,
        "lng": 24.7493779
    },
    {
        "day": 4,
        "name": "Rethymno Old Town",
        "query": "Rethymno Old Town Venetian Harbour Rethymno Crete Greece",
        "lat": 35.3687,
        "lng": 24.4743
    },
    {
        "day": 4,
        "name": "Fortezza of Rethymno",
        "query": "Fortezza Rethymno Crete Greece",
        "lat": 35.3713,
        "lng": 24.4714
    },
    {
        "day": 4,
        "name": "Preveli Beach",
        "query": "Preveli Beach Plakias Rethymno Crete Greece",
        "lat": 35.1478,
        "lng": 24.5298
    },
    {
        "day": 5,
        "name": "Toplou Monastery",
        "query": "Toplou Monastery Sitia Lasithi Crete Greece",
        "lat": 35.2128,
        "lng": 26.2328
    },
    {
        "day": 5,
        "name": "Vai Beach",
        "query": "Vai Beach Lasithi Crete Greece",
        "lat": 35.2432,
        "lng": 26.2738
    },
    {
        "day": 5,
        "name": "Kato Zakros Palace",
        "query": "Palace of Kato Zakros Sitia Lasithi Crete Greece",
        "lat": 35.0867,
        "lng": 26.2733
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#8b5cf6", "5": "#10b981"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
