<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>Rio-de-Janeiro — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Rio-de-Janeiro — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#16a085">Day 6</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 2,
        "name": "Confeitaria Colombo",
        "query": "Confeitaria Colombo R Goncalves Dias 32 Centro Rio de Janeiro",
        "lat": -22.9051703,
        "lng": -43.1787441
    },
    {
        "day": 3,
        "name": "Escadaria Selarón",

        "lat": -22.9154446,
        "lng": -43.179455
    },
    {
        "day": 3,
        "name": "Parque das Ruínas",
        "query": "Parque das Ruinas R Murtinho Nobre 169 Santa Teresa Rio de Janeiro",
        "lat": -22.9178273,
        "lng": -43.1824768
    },
    {
        "day": 2,
        "name": "Museu do Amanhã",
        "query": "Museu do Amanha Praca Maua 1 Porto Maravilha Rio de Janeiro",
        "lat": -22.8940683,
        "lng": -43.1794045
    },
    {
        "day": 1,
        "name": "Sugarloaf Mountain",
        "query": "Sugarloaf Mountain Av Pasteur 520 Urca Rio de Janeiro",
        "lat": -22.9494891,
        "lng": -43.1561568
    },
    {
        "day": 4,
        "name": "Cascatinha Taunay — Tijuca National Park",
        "query": "Cascatinha Taunay Estrada da Cascatinha 850 Alto da Boa Vista Rio de Janeiro",
        "lat": -22.95877,
        "lng": -43.2772583
    },
    {
        "day": 6,
        "name": "MAC Niterói",
        "query": "MAC Niteroi Mirante da Boa Viagem Niteroi",
        "lat": -22.8811456,
        "lng": -43.1213773
    },
    {
        "day": 4,
        "name": "Parque Lage",
        "query": "Parque Lage R Jardim Botanico 414 Rio de Janeiro",
        "lat": -22.9601522,
        "lng": -43.2109632
    },
    {
        "day": 5,
        "name": "Jardim Botânico",
        "query": "Jardim Botanico R Jardim Botanico 1008 Rio de Janeiro",
        "lat": -22.9704561,
        "lng": -43.2232759
    },
    {
        "day": 1,
        "name": "Forte de Copacabana",
        "query": "Forte de Copacabana Praca Cel Eugenio Franco 1 Copacabana Rio de Janeiro",
        "lat": -22.9864393,
        "lng": -43.1872003
    },
    {
        "day": 2,
        "name": "Royal Portuguese Cabinet of Reading",
        "query": "Real Gabinete Português de Leitura Rua Luís de Camões 30 Centro Rio de Janeiro",
        "lat": -22.9053692,
        "lng": -43.1822094
    },
    {
        "day": 2,
        "name": "Theatro Municipal",
        "query": "Theatro Municipal Praça Floriano Centro Rio de Janeiro",
        "lat": -22.9090481,
        "lng": -43.1765575
    },
    {
        "day": 2,
        "name": "National Historical Museum",
        "query": "Museu Histórico Nacional Praça Marechal Âncora Centro Rio de Janeiro",
        "lat": -22.9057898,
        "lng": -43.1696851
    },
    {
        "day": 4,
        "name": "Cristo Redentor",
        "query": "Estacao Corcovado R Cosme Velho 513 Rio de Janeiro",
        "lat": -22.9406446,
        "lng": -43.1985422
    },
    {
        "day": 1,
        "name": "Praia de Ipanema",
        "query": "Praia de Ipanema Avenida Vieira Souto Ipanema Rio de Janeiro",
        "lat": -22.9863167,

    },
    {
        "day": 5,
        "name": "Rodrigo de Freitas Lagoon",
        "query": "Lagoa Rodrigo de Freitas Av Epitácio Pessoa Lagoa Rio de Janeiro",
        "lat": -22.9716274,
        "lng": -43.2120593
    },
    {
        "day": 5,
        "name": "Instituto Moreira Salles",
        "query": "Instituto Moreira Salles Rua Marquês de São Vicente 476 Gávea Rio de Janeiro",
        "lat": -22.9816223,
        "lng": -43.2393472
    },
    {
        "day": 4,
        "name": "Tijuca National Park",
        "query": "Tijuca National Park Estrada da Cascatinha Alto da Boa Vista Rio de Janeiro",
        "lat": -22.960648,
        "lng": -43.2505932
    },
    {
        "day": 6,
        "name": "Museu do Índio",
        "query": "Museu do Índio Rua das Palmeiras 55 Botafogo Rio de Janeiro",
        "lat": -22.9518371,
        "lng": -43.1910035
    },
    {
        "day": 3,
        "name": "Catete Palace",
        "query": "Palácio do Catete Rua do Catete 153 Catete Rio de Janeiro",
        "lat": -22.9258642,
        "lng": -43.1762213
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22", "6": "#16a085"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
