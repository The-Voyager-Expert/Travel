<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../assets/web-travel-style.css">
<link rel="stylesheet" href="../../assets/mobile.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="../../assets/stops-map-style.css">
<title>Seattle — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="Seattle — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../../Trip-Essentials/Maps/vendor/leaflet.min.js"></script>
<script src="../../Trip-Essentials/Maps/vendor/markercluster.min.js"></script>
<script src="../../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Chihuly Garden and Glass",
        "query": "Chihuly Garden and Glass 305 Harrison St Seattle WA",
        "lat": 47.6205296,
        "lng": -122.3502071
    },
    {
        "day": 1,
        "name": "Space Needle",
        "query": "Space Needle 400 Broad St Seattle WA",
        "lat": 47.6205131,
        "lng": -122.3493036
    },
    {
        "day": 1,
        "name": "Museum of Pop Culture",
        "query": "Museum of Pop Culture 325 5th Ave N Seattle WA",
        "lat": 47.6214931,
        "lng": -122.3482253
    },
    {
        "day": 1,
        "name": "Olympic Sculpture Park",
        "query": "Olympic Sculpture Park 2901 Western Ave Seattle WA",
        "lat": 47.6162378,
        "lng": -122.3543133
    },
    {
        "day": 2,
        "name": "Seattle Great Wheel",
        "query": "Seattle Great Wheel 1301 Alaskan Way Seattle WA",
        "lat": 47.6061669,
        "lng": -122.3424999
    },
    {
        "day": 2,
        "name": "Victor Steinbrueck Park",
        "query": "Victor Steinbrueck Park Western Ave & Virginia St Seattle WA",
        "lat": 47.6100906,
        "lng": -122.3437933
    },
    {
        "day": 3,
        "name": "Seattle Central Library",
        "query": "Seattle Central Library 1000 4th Ave Seattle WA",
        "lat": 47.6067142,
        "lng": -122.3326983
    },
    {
        "day": 3,
        "name": "Smith Tower",
        "query": "Smith Tower 506 2nd Ave Seattle WA",
        "lat": 47.6020094,
        "lng": -122.3317853
    },
    {
        "day": 2,
        "name": "Gas Works Park",
        "query": "Gas Works Park 2101 N Northlake Way Seattle WA",
        "lat": 47.6466989,
        "lng": -122.3321395
    },
    {
        "day": 4,
        "name": "Fremont Troll",
        "query": "Fremont Troll 3405 Troll Ave N Seattle WA",
        "lat": 47.6510483,
        "lng": -122.347234
    },
    {
        "day": 2,
        "name": "Volunteer Park Conservatory",
        "query": "Volunteer Park Conservatory 1400 E Galer St Seattle WA",
        "lat": 47.6321084,
        "lng": -122.3157349
    },
    {
        "day": 4,
        "name": "Kerry Park",
        "query": "Kerry Park 211 W Highland Dr Seattle WA",
        "lat": 47.6294074,
        "lng": -122.3599259
    },
    {
        "day": 4,
        "name": "Hiram M. Chittenden Locks",
        "query": "Hiram M Chittenden Locks 3015 NW 54th St Seattle WA",
        "lat": 47.6660193,
        "lng": -122.3977506
    },
    {
        "day": 4,
        "name": "Nordic Museum",
        "query": "Nordic Museum 2655 NW Market St Seattle WA",
        "lat": 47.6682856,
        "lng": -122.3917729
    },
    {
        "day": 3,
        "name": "Wing Luke Museum",
        "query": "Wing Luke Museum 719 S King St Seattle WA",
        "lat": 47.5982461,
        "lng": -122.3228705
    },
    {
        "day": 3,
        "name": "Klondike Gold Rush National Historical Park",
        "query": "Klondike Gold Rush National Historical Park 319 2nd Ave S Seattle WA",
        "lat": 47.599381,
        "lng": -122.331864
    },
    {
        "day": 5,
        "name": "International Rose Test Garden",
        "query": "International Rose Test Garden 400 SW Kingston Ave Portland OR",
        "lat": null,
        "lng": null
    },
    {
        "day": 5,
        "name": "Portland Japanese Garden",
        "query": "Portland Japanese Garden 611 SW Kingston Ave Portland OR",
        "lat": null,
        "lng": null
    },
    {
        "day": 5,
        "name": "Lan Su Chinese Garden",
        "query": "Lan Su Chinese Garden 239 NW Everett St Portland OR",
        "lat": null,
        "lng": null
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
