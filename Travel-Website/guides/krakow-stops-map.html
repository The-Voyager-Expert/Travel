<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>Kraków — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Kraków — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#16a085">Day 6</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Wawel Castle",
        "query": "Wawel Castle Krakow",
        "lat": 50.0544051,
        "lng": 19.9360223
    },
    {
        "day": 1,
        "name": "Wawel Cathedral",
        "query": "Wawel Cathedral Krakow",
        "lat": 50.0546504,
        "lng": 19.9354554
    },
    {
        "day": 2,
        "name": "St. Mary's Basilica",
        "query": "St Mary Basilica Krakow",
        "lat": 50.0616547,
        "lng": 19.9394485
    },
    {
        "day": 2,
        "name": "Main Square",
        "query": "Rynek Glowny Krakow",
        "lat": 50.0615174,
        "lng": 19.9371069
    },
    {
        "day": 2,
        "name": "Kraków Barbican",
        "query": "Krakow Barbican",
        "lat": 50.0654581,
        "lng": 19.941451
    },
    {
        "day": 2,
        "name": "Czartoryski Museum",
        "query": "Czartoryski Museum Krakow",
        "lat": 50.0647985,
        "lng": 19.9403381
    },
    {
        "day": 3,
        "name": "Galicia Jewish Museum",
        "query": "Galicia Jewish Museum Krakow",
        "lat": 50.0508571,
        "lng": 19.9496775
    },
    {
        "day": 3,
        "name": "Old Synagogue",
        "query": "Old Synagogue Krakow",
        "lat": 50.0513668,
        "lng": 19.9486379
    },
    {
        "day": 3,
        "name": "Schindler's Factory",
        "query": "Schindler Factory Krakow",
        "lat": 50.0474554,
        "lng": 19.9617094
    },
    {
        "day": 4,
        "name": "Collegium Maius",
        "query": "Collegium Maius Krakow",
        "lat": 50.0615629,
        "lng": 19.9334091
    },
    {
        "day": 4,
        "name": "Eagle Pharmacy",
        "query": "Plac Bohaterow Getta 18 Podgorze Krakow",
        "lat": 50.0462364,
        "lng": 19.9541481
    },
    {
        "day": 4,
        "name": "Plac Bohaterów Getta",
        "query": "Plac Bohaterow Getta Podgorze Krakow",
        "lat": 50.0467762,
        "lng": 19.9544056
    },
    {
        "day": 4,
        "name": "National Museum in Kraków",
        "query": "al 3 Maja 1 Krakow National Museum",
        "lat": 50.0604369,
        "lng": 19.9236105
    },
    {
        "day": 4,
        "name": "Manggha Museum",
        "query": "Marii Konopnickiej 26 Krakow",
        "lat": 50.0508331,
        "lng": 19.9316472
    },
    {
        "day": 5,
        "name": "Plac Centralny",
        "query": "Plac Centralny Nowa Huta Krakow",
        "lat": 50.0718815,
        "lng": 20.0380667
    },
    {
        "day": 5,
        "name": "Museum Nowej Huty",
        "query": "Osiedle Centrum E 1 Nowa Huta Krakow",
        "lat": 50.0699606,
        "lng": 20.0412156
    },
    {
        "day": 5,
        "name": "Wanda Mound",
        "query": "Kopiec Wandy Krakow",
        "lat": 50.0702259,
        "lng": 20.0680789
    },
    {
        "day": 5,
        "name": "Mogiła Abbey",
        "query": "Klasztorna 11 Mogila Krakow",
        "lat": 50.0647858,
        "lng": 20.0533456
    },
    {
        "day": 6,
        "name": "Krupówki",
        "query": "Krupowki Street Zakopane",
        "lat": 49.2960371,
        "lng": 19.9497071
    },
    {
        "day": 6,
        "name": "Gubałówka",
        "query": "Funicular Gubalowka Zakopane",
        "lat": 49.301457,
        "lng": 19.9384497
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22", "6": "#16a085"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
