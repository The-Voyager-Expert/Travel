<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Portland — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Portland Art Museum",
        "query": "1219 SW Park Avenue, Portland, OR",
        "lat": 45.5165483,
        "lng": -122.6834106
    },
    {
        "day": 1,
        "name": "Lan Su Chinese Garden",
        "query": "239 NW Everett Street, Portland, OR",
        "lat": 45.5253509,
        "lng": -122.6727591
    },
    {
        "day": 1,
        "name": "Pearl District",
        "query": "NW 9th Avenue, Pearl District, Portland, OR",
        "lat": 45.5325826,
        "lng": -122.6801246
    },
    {
        "day": 1,
        "name": "Willamette River Waterfront",
        "query": "Tom McCall Waterfront Park, SW Naito Pkwy, Portland, OR",
        "lat": 45.5165774,
        "lng": -122.6675961
    },
    {
        "day": 2,
        "name": "International Rose Test Garden",
        "query": "400 SW Kingston Ave, Portland, OR",
        "lat": 45.520703,
        "lng": -122.706647
    },
    {
        "day": 2,
        "name": "Portland Japanese Garden",
        "query": "611 SW Kingston Ave, Portland, OR",
        "lat": 45.5207099,
        "lng": -122.7067631
    },
    {
        "day": 2,
        "name": "Hoyt Arboretum",
        "query": "4000 SW Fairview Blvd, Portland, OR",
        "lat": 45.5156706,
        "lng": -122.7156639
    },
    {
        "day": 2,
        "name": "Pittock Mansion",
        "query": "3229 NW Pittock Drive, Portland, OR",
        "lat": 45.5251956,
        "lng": -122.7162395
    },
    {
        "day": 4,
        "name": "Mount Tabor Park",
        "query": "SE 60th Ave & SE Salmon St, Portland, OR",
        "lat": 45.5114105,
        "lng": -122.5960423
    },
    {
        "day": 1,
        "name": "Oregon Museum of Science and Industry · OMSI",
        "query": "1945 SE Water Ave, Portland, OR",
        "lat": 45.5083494,
        "lng": -122.6656619
    },
    {
        "day": 3,
        "name": "Multnomah Falls",
        "query": "Multnomah Falls, Historic Columbia River Highway, OR",
        "lat": 45.577448,
        "lng": -122.1174806
    },
    {
        "day": 2,
        "name": "Forest Park",
        "query": "NW 29th Avenue Upshur Street Portland OR",
        "lat": 45.5301,
        "lng": -122.7101
    },
    {
        "day": 4,
        "name": "Crystal Springs Rhododendron Garden",
        "query": "Crystal Springs Rhododendron Garden SE 28th Portland OR",
        "lat": 45.4812,
        "lng": -122.6295
    },
    {
        "day": 5,
        "name": "The Grotto",
        "query": "The Grotto NE 85th Avenue Portland OR",
        "lat": 45.547,
        "lng": -122.5958
    },
    {
        "day": 5,
        "name": "Portland Aerial Tram",
        "query": "SW Moody Avenue Gibbs Street Portland OR",
        "lat": 45.5008,
        "lng": -122.6704
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
