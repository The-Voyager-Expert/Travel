<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../assets/web-travel-style.css">
<link rel="stylesheet" href="../assets/mobile.css">
<link rel="stylesheet" href="../essentials/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../essentials/maps/vendor/MarkerCluster.min.css">
<title>Cape-Cod — All Stops Map</title>
<link rel="stylesheet" href="../assets/stops-map-style.css">
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Cape-Cod — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../essentials/maps/vendor/leaflet.min.js"></script>
<script src="../essentials/maps/vendor/markercluster.min.js"></script>
<script src="../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 2,
        "name": "Nauset Light Beach",
        "query": "Nauset Light Cable Road Eastham MA",
        "lat": 41.8590505,
        "lng": -69.9511708
    },
    {
        "day": 2,
        "name": "Cape Cod National Seashore",
        "query": "99 Marconi Site Road Wellfleet MA",
        "lat": 41.912763,
        "lng": -69.972636
    },
    {
        "day": 2,
        "name": "Marconi Beach",
        "query": "Marconi Beach Road Wellfleet MA",
        "lat": 41.8958618,
        "lng": -69.9736771
    },
    {
        "day": 5,
        "name": "Herring Cove Beach",
        "query": "Province Lands Road Provincetown MA",
        "lat": 42.0432572,
        "lng": -70.2141567
    },
    {
        "day": 1,
        "name": "Cape Cod Maritime Museum",
        "query": "135 South Street Hyannis MA",
        "lat": 41.6515866,
        "lng": -70.2794223
    },
    {
        "day": 4,
        "name": "Chatham Light",
        "query": "37 Main Street Chatham MA",
        "lat": 41.6714041,
        "lng": -69.9498826
    },
    {
        "day": 4,
        "name": "Chatham Main Street",
        "query": "Main Street Chatham MA",
        "lat": 41.6826233,
        "lng": -69.9612907
    },
    {
        "day": 3,
        "name": "Skaket Beach",
        "query": "Skaket Beach Road Orleans MA",
        "lat": 41.7898957,
        "lng": -70.0029443
    },
    {
        "day": 1,
        "name": "Heritage Museums and Gardens",
        "query": "67 Grove Street Sandwich MA",
        "lat": 41.7486723,
        "lng": -70.5059897
    },
    {
        "day": 2,
        "name": "Wellfleet Bay Wildlife Sanctuary",
        "query": "291 Route 6 South Wellfleet MA",
        "lat": 41.882619,
        "lng": -69.995482
    },
    {
        "day": 2,
        "name": "Eastham Windmill",
        "query": "Eastham Windmill Town Green Eastham MA",
        "lat": 41.830519,
        "lng": -69.974527
    },
    {
        "day": 1,
        "name": "Sandwich Glass Museum",
        "query": "129 Main Street Sandwich MA",
        "lat": 41.758691,
        "lng": -70.500422
    },
    {
        "day": 3,
        "name": "Nickerson State Park",
        "query": "Nickerson State Park Route 6A Brewster MA",
        "lat": 41.756498,
        "lng": -70.019264
    },
    {
        "day": 3,
        "name": "Cape Cod Museum of Natural History",
        "query": "869 Route 6A Brewster MA",
        "lat": 41.751086,
        "lng": -70.115206
    },
    {
        "day": 5,
        "name": "Pilgrim Monument",
        "query": "1 High Pole Hill Road Provincetown MA",
        "lat": 42.0586,
        "lng": -70.1877
    },
    {
        "day": 5,
        "name": "Provincetown Art Association and Museum",
        "query": "460 Commercial Street Provincetown MA",
        "lat": 42.0519,
        "lng": -70.1811
    },
    {
        "day": 5,
        "name": "Highland Light",
        "query": "27 Highland Light Road Truro MA",
        "lat": 42.0332,
        "lng": -70.0689
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
