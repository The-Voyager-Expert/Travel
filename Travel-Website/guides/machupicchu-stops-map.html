<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="MachuPicchu — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#16a085">Day 6</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 3,
        "name": "Machu Picchu Citadel",
        "query": "Machu Picchu Archaeological Site Aguas Calientes Cusco Peru",
        "lat": -13.164341,
        "lng": -72.5450094
    },
    {
        "day": 1,
        "name": "Museo de Sitio Manuel Chávez Ballón",
        "query": "Museo de Sitio Manuel Chavez Ballon Carretera Hiram Bingham Aguas Calientes Peru",
        "lat": -13.1605619,
        "lng": -72.5393299
    },
    {
        "day": 5,
        "name": "Baños Termales de Aguas Calientes",
        "query": "Banos Termales Aguas Calientes Peru",
        "lat": -13.1509211,
        "lng": -72.5212471
    },
    {
        "day": 2,
        "name": "Huayna Picchu",
        "query": "Huayna Picchu trail entrance Machu Picchu Peru",
        "lat": -13.1566647,
        "lng": -72.5459857
    },
    {
        "day": 2,
        "name": "Inca Bridge",
        "query": "Inca Bridge Machu Picchu Archaeological Zone Peru",
        "lat": -13.1622,
        "lng": -72.5481
    },
    {
        "day": 4,
        "name": "Aguas Calientes",
        "query": "Mercado Artesanal Avenida Imperio de los Incas Aguas Calientes Peru",
        "lat": -13.1542838,
        "lng": -72.5256464
    },
    {
        "day": 1,
        "name": "Montana Machu Picchu",
        "query": "Montana Machu Picchu trail Cusco Peru",
        "lat": -13.1747287,
        "lng": -72.5418769
    },
    {
        "day": 4,
        "name": "Jardines de Mandor",
        "query": "Los Jardines de Mandor Aguas Calientes Peru",
        "lat": -13.1490091,
        "lng": -72.5399332
    },
    {
        "day": 4,
        "name": "Manco Capac Plaza",
        "query": "Plaza Manco Capac Aguas Calientes Peru",
        "lat": -13.1543294,
        "lng": -72.5256776
    },
    {
        "day": 6,
        "name": "Ollantaytambo Archaeological Site",
        "query": "Ollantaytambo Archaeological Site Cusco Peru",
        "lat": -13.255845,
        "lng": -72.2663165
    },
    {
        "day": 6,
        "name": "Pinkuylluna Granaries",
        "query": "Pinkuylluna hill Ollantaytambo Cusco Peru",
        "lat": -13.2569237,
        "lng": -72.2608454
    },
    {
        "day": 6,
        "name": "Ollantaytambo Town",
        "query": "Plaza de Armas Ollantaytambo Cusco Peru",
        "lat": -13.2586707,
        "lng": -72.2636416
    },
    {
        "day": 4,
        "name": "Inti Punku",
        "query": "Intipunku Sun Gate Machu Picchu Peru",
        "lat": -13.1697518,
        "lng": -72.5339303
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22", "6": "#16a085"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
