<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../assets/web-travel-style.css">
<link rel="stylesheet" href="../assets/mobile.css">
<link rel="stylesheet" href="../essentials/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../essentials/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="../assets/stops-map-style.css">
<title>Seville — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Seville — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../essentials/maps/vendor/leaflet.min.js"></script>
<script src="../essentials/maps/vendor/markercluster.min.js"></script>
<script src="../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 3,
        "name": "Metropol Parasol",
        "query": "Plaza de la Encarnación s/n, Casco Antiguo, Seville",
        "lat": 37.3930534,
        "lng": -5.9914274
    },
    {
        "day": 3,
        "name": "Palacio de las Dueñas",
        "query": "Calle Dueñas 5 Seville",
        "lat": 37.3953811,
        "lng": -5.9894122
    },
    {
        "day": 3,
        "name": "Casa de Pilatos",
        "query": "Plaza de Pilatos 1 Seville",
        "lat": 37.3902394,
        "lng": -5.9872491
    },
    {
        "day": 2,
        "name": "Seville Cathedral &amp; Giralda",
        "query": "Plaza del Triunfo, Santa Cruz, Seville",
        "lat": 37.3849113,
        "lng": -5.9925711
    },
    {
        "day": 2,
        "name": "Barrio Santa Cruz",
        "query": "Calle Mateos Gago, Santa Cruz, Seville",
        "lat": 37.3861585,
        "lng": -5.9905668
    },
    {
        "day": 1,
        "name": "Alcázar of Seville",
        "query": "Calle Patio de Banderas s/n, Santa Cruz, Seville",
        "lat": 37.3832105,
        "lng": -5.9901835
    },
    {
        "day": 1,
        "name": "Archivo General de Indias",
        "query": "Avenida de la Constitución s/n Seville",
        "lat": 37.3834729,
        "lng": -5.9936715
    },
    {
        "day": 3,
        "name": "Palacio de la Condesa de Lebrija",
        "query": "Calle Cuna 8 Seville",
        "lat": 37.392152,
        "lng": -5.9937011
    },
    {
        "day": 2,
        "name": "Plaza de España",
        "query": "Av. Isabel la Católica, Parque de María Luisa, Seville",
        "lat": 37.3760253,
        "lng": -5.98721
    },
    {
        "day": 1,
        "name": "Real Fábrica de Tabacos",
        "query": "Calle San Fernando 4 Seville",
        "lat": 37.3818133,
        "lng": -5.9910238
    },
    {
        "day": 4,
        "name": "Torre del Oro",
        "query": "Paseo de Cristóbal Colón s/n Seville",
        "lat": 37.3837859,
        "lng": -5.9973023
    },
    {
        "day": 4,
        "name": "Real Maestranza",
        "query": "Paseo de Cristóbal Colón 12, El Arenal, Seville",
        "lat": 37.3859079,
        "lng": -5.9989192
    },
    {
        "day": 4,
        "name": "Museo de Bellas Artes",
        "query": "Plaza del Museo 9, Casco Antiguo, Seville",
        "lat": 37.392416,
        "lng": -6.0000135
    },
    {
        "day": 4,
        "name": "Basílica de la Macarena",
        "query": "Calle Bécquer 1, La Macarena, Seville",
        "lat": null,
        "lng": null
    },
    {
        "day": 5,
        "name": "Mezquita-Catedral de Córdoba",
        "query": "Calle Cardenal Herrero 1, Casco Histórico, Córdoba",
        "lat": null,
        "lng": null
    },
    {
        "day": 5,
        "name": "Judería &amp; Synagogue of Córdoba",
        "query": "Calle Judíos 20, Judería, Córdoba",
        "lat": null,
        "lng": null
    },
    {
        "day": 5,
        "name": "Alcázar de los Reyes Cristianos",
        "query": "Plaza Campo Santo de los Mártires s/n, Casco Histórico, Córdoba",
        "lat": null,
        "lng": null
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
