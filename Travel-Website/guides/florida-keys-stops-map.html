<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>Florida-Keys — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Florida-Keys — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Mallory Square Sunset",
        "query": "Mallory Square Key West Florida",
        "lat": 24.5591876,
        "lng": -81.8067454
    },
    {
        "day": 1,
        "name": "Duval Street Historic District",
        "query": "Duval Street Key West Florida",
        "lat": 24.5491734,
        "lng": -81.7978315
    },
    {
        "day": 1,
        "name": "Fort Jefferson",
        "query": "Key West Historic Seaport Florida",
        "lat": 24.5591094,
        "lng": -81.8030976
    },
    {
        "day": 1,
        "name": "Glass Bottom Boat Tour",
        "query": "Fury Water Adventures Key West Florida",
        "lat": 24.5608359,
        "lng": -81.8071077
    },
    {
        "day": 2,
        "name": "Bahia Honda State Park",
        "query": "Bahia Honda State Park Big Pine Key Florida",
        "lat": 24.6606655,
        "lng": -81.2733565
    },
    {
        "day": 2,
        "name": "Swimming with Dolphins",
        "query": "Dolphins Plus Islamorada Florida",
        "lat": 25.1190267,
        "lng": -80.4189902
    },
    {
        "day": 3,
        "name": "John Pennekamp Coral Reef State Park",
        "query": "John Pennekamp Coral Reef State Park Key Largo Florida",
        "lat": 25.1291735,
        "lng": -80.386551
    },
    {
        "day": 3,
        "name": "Key West Butterfly Conservatory",
        "query": "Key West Butterfly Conservatory 1316 Duval Street",
        "lat": 24.5475638,
        "lng": -81.7968249
    },
    {
        "day": 3,
        "name": "Key West Shipwreck Museum",
        "query": "Key West Shipwreck Museum 1 Whitehead Street",
        "lat": 24.5590493,
        "lng": -81.8069426
    },
    {
        "day": 4,
        "name": "Ernest Hemingway Home and Museum",
        "query": "Ernest Hemingway Home 907 Whitehead Street Key West",
        "lat": 24.5511923,
        "lng": -81.8006162
    },
    {
        "day": 4,
        "name": "Key West Lighthouse",
        "query": "Key West Lighthouse 938 Whitehead Street Key West",
        "lat": 24.5506299,
        "lng": -81.8008763
    },
    {
        "day": 4,
        "name": "Harry S. Truman Little White House",
        "query": "Harry S Truman Little White House 111 Front Street Key West",
        "lat": 24.556274,
        "lng": -81.8068647
    },
    {
        "day": 4,
        "name": "Mel Fisher Maritime Museum",
        "query": "Mel Fisher Maritime Museum 200 Greene Street Key West",
        "lat": 24.5580622,
        "lng": -81.8064833
    },
    {
        "day": 5,
        "name": "Pigeon Key",
        "query": "Pigeon Key Visitor Center 2010 Overseas Highway Marathon",
        "lat": 24.7067292,
        "lng": -81.1212427
    },
    {
        "day": 5,
        "name": "Turtle Hospital",
        "query": "Turtle Hospital 2396 Overseas Highway Marathon",
        "lat": 24.7097664,
        "lng": -81.101717
    },
    {
        "day": 5,
        "name": "Crane Point Museum and Nature Center",
        "query": "Crane Point Museum 5550 Overseas Highway Marathon",
        "lat": 24.7168936,
        "lng": -81.0752405
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
