<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>Tokyo — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Tokyo — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#16a085">Day 6</button>
  <button class="day-btn" data-day="7" style="--dc:#e74c3c">Day 7</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
  {
    "day": 1,
    "name": "Meiji Shrine",
    "query": "Meiji Shrine 1-1 Yoyogikamizonocho Shibuya Tokyo",
    "lat": 35.6748417,
    "lng": 139.6996266
  },
  {
    "day": 1,
    "name": "Shinjuku Gyoen",
    "query": "Shinjuku Gyoen 11 Naitomachi Shinjuku Tokyo",
    "lat": 35.6850716,
    "lng": 139.7095466
  },
  {
    "day": 2,
    "name": "teamLab Borderless",
    "query": "teamLab Borderless Azabudai Hills 1-2-4 Azabudai Minato Tokyo",
    "lat": 35.6620024,
    "lng": 139.7434178
  },
  {
    "day": 2,
    "name": "Mori Art Museum",
    "query": "Mori Art Museum Roppongi Hills Mori Tower 53F 6-10-1 Roppongi Minato Tokyo",
    "lat": 35.660432,
    "lng": 139.729261
  },
  {
    "day": 3,
    "name": "teamLab Planets",
    "query": "teamLab Planets 6-1-16 Toyosu Koto Tokyo",
    "lat": 35.64938,
    "lng": 139.789728
  },
  {
    "day": 3,
    "name": "Tokyo Skytree",
    "query": "Tokyo Skytree 1-1-2 Oshiage Sumida Tokyo",
    "lat": 35.7100543,
    "lng": 139.8107141
  },
  {
    "day": 4,
    "name": "Tokyo National Museum",
    "query": "Tokyo National Museum 13-9 Uenokoen Taito Tokyo",
    "lat": 35.7190448,
    "lng": 139.7759676
  },
  {
    "day": 4,
    "name": "Imperial Palace East Garden",
    "query": "Imperial Palace East Garden 1-1 Chiyoda Tokyo",
    "lat": 35.6867824,
    "lng": 139.7571445
  },
  {
    "day": 4,
    "name": "Hamarikyu Gardens",
    "query": "Hamarikyu Gardens 1-1 Hamarikyu Teien Chuo Tokyo",
    "lat": 35.6642262,
    "lng": 139.7640453
  },
  {
    "day": 5,
    "name": "Tokyo DisneySea",
    "query": "Tokyo DisneySea 1-13 Maihama Urayasu Chiba",
    "lat": 35.6276516,
    "lng": 139.8886465
  },
  {
    "day": 6,
    "name": "Senso-ji Temple",
    "query": "Sensoji Temple 2-3-1 Asakusa Taito Tokyo",
    "lat": 35.7134032,
    "lng": 139.7955265
  },
  {
    "day": 6,
    "name": "Sumida Hokusai Museum",
    "query": "Sumida Hokusai Museum 2-7-2 Kamezawa Sumida Tokyo",
    "lat": 35.6963779,
    "lng": 139.8004717
  },
  {
    "day": 6,
    "name": "Nezu Shrine",
    "query": "Nezu Shrine 1-28-9 Nezu Bunkyo Tokyo",
    "lat": 35.7199731,
    "lng": 139.7606625
  },
  {
    "day": 6,
    "name": "Yanaka Ginza",
    "query": "Yanaka Ginza 3-13 Yanaka Taito Tokyo",
    "lat": 35.7276689,
    "lng": 139.7653174
  },
  {
    "day": 7,
    "name": "Nikko Toshogu",
    "query": "Nikko Toshogu 2301 Sannai Nikko Tochigi",
    "lat": 36.7580878,
    "lng": 139.5987466
  }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22", "6": "#16a085", "7": "#e74c3c"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
