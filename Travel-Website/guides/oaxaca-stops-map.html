<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Oaxaca — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Zócalo de Oaxaca",
        "query": "Zócalo de Oaxaca, Plaza de la Constitución, Centro, Oaxaca",
        "lat": 17.0605953,
        "lng": -96.7253435
    },
    {
        "day": 1,
        "name": "Templo de Santo Domingo de Guzmán",
        "query": "Templo de Santo Domingo de Guzmán, Macedonio Alcalá 507, Centro, Oaxaca",
        "lat": 17.0656246,
        "lng": -96.7230004
    },
    {
        "day": 1,
        "name": "Jardín Etnobotánico de Oaxaca",
        "query": "Jardín Etnobotánico de Oaxaca, Reforma, Centro, Oaxaca",
        "lat": 17.0665049,
        "lng": -96.7222755
    },
    {
        "day": 1,
        "name": "Basílica de Nuestra Señora de la Soledad",
        "query": "Basílica de Nuestra Señora de la Soledad, Av. Independencia 107, Centro, Oaxaca",
        "lat": 17.0635444,
        "lng": -96.7299384
    },
    {
        "day": 2,
        "name": "Monte Albán",
        "query": "Monte Albán, Santa Cruz Xoxocotlán, Oaxaca",
        "lat": 17.0221872,
        "lng": -96.7587615
    },
    {
        "day": 1,
        "name": "Museo Textil de Oaxaca",
        "query": "Museo Textil de Oaxaca, Av. Hidalgo 917, Centro, Oaxaca",
        "lat": 17.0607748,
        "lng": -96.7229196
    },
    {
        "day": 1,
        "name": "Árbol del Tule",
        "query": "Árbol del Tule, Carretera Internacional, Santa María del Tule, Oaxaca",
        "lat": 17.0464679,
        "lng": -96.6361632
    },
    {
        "day": 3,
        "name": "Zona Arqueológica de Mitla",
        "query": "Zona Arqueológica de Mitla, San Pablo Villa de Mitla, Oaxaca",
        "lat": 16.9272875,
        "lng": -96.3596037
    },
    {
        "day": 3,
        "name": "Hierve el Agua",
        "query": "Hierve el Agua, San Lorenzo Albarradas, Oaxaca",
        "lat": 16.8678348,
        "lng": -96.2763842
    },
    {
        "day": 4,
        "name": "Zona Arqueológica de Atzompa",
        "query": "Zona Arqueológica Atzompa, Cerro de la Campaña, Santa María Atzompa, Oaxaca",
        "lat": 17.0788265,
        "lng": -96.7817651
    },
    {
        "day": 4,
        "name": "Ex-Convento de Santiago Apóstol · Cuilapam de Guerrero",
        "query": "Ex-Convento de Santiago Apóstol, Cuilapam de Guerrero, Oaxaca",
        "lat": 16.9922163,
        "lng": -96.779152
    },
    {
        "day": 4,
        "name": "Museo de las Culturas de Oaxaca",
        "query": "Museo de las Culturas de Oaxaca, Macedonio Alcalá, Centro, Oaxaca",
        "lat": 17.0659197,
        "lng": -96.7231501
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
