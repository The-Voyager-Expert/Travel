<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Madeira — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>

  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Teleférico do Funchal",
        "query": "Teleférico do Funchal Rua do Vigário 8 Funchal",
        "lat": 32.6613394,
        "lng": -16.9012089
    },
    {
        "day": 1,

        "query": "Caminho do Meio Funchal Madeira",

    },
    {
        "day": 1,
        "name": "Rua de Santa Maria",
        "query": "Rua de Santa Maria Funchal Zona Velha",
        "lat": 32.6478866,
        "lng": -16.9006877
    },
    {
        "day": 1,
        "name": "Forte de São Tiago",
        "query": "Forte de São Tiago Rua do Portão de São Tiago Funchal",
        "lat": 32.646722,
        "lng": -16.8987506
    },
    {
        "day": 1,
        "name": "Monte Palace Tropical Garden",
        "query": "Monte Palace Tropical Garden Caminho do Monte 174 Funchal",
        "lat": 32.6741918,
        "lng": -16.9028785
    },
    {
        "day": 1,
        "name": "Sé Cathedral",
        "query": "Sé Cathedral Largo da Sé Funchal",
        "lat": 32.648131,
        "lng": -16.9082826
    },
    {
        "day": 2,
        "name": "Cabo Girão",
        "query": "Cabo Girão Câmara de Lobos Madeira",
        "lat": 32.6564809,
        "lng": -17.0044527
    },
    {
        "day": 2,
        "name": "Câmara de Lobos",
        "query": "Largo da República Câmara de Lobos Madeira",
        "lat": 32.6485492,
        "lng": -16.9752409
    },
    {
        "day": 3,
        "name": "Pico do Arieiro",
        "query": "Pico do Arieiro Madeira",
        "lat": 32.7357336,
        "lng": -16.9287131
    },
    {
        "day": 3,
        "name": "Curral das Freiras",
        "query": "Miradouro da Eira do Serrado Madeira",
        "lat": 32.7011896,
        "lng": -16.9585747
    },
    {
        "day": 3,
        "name": "Ribeiro Frio &amp; Balcões Levada",
        "query": "Ribeiro Frio Madeira",
        "lat": 32.7396155,
        "lng": -16.8869417
    },
    {
        "day": 4,
        "name": "Ponta de São Lourenço",
        "query": "Ponta de Sao Lourenco Nature Reserve Canical Madeira",
        "lat": 32.7452119,
        "lng": -16.6981211
    },
    {
        "day": 4,
        "name": "Machico",
        "query": "Largo António Fernandes Machico Madeira",
        "lat": 32.7166,
        "lng": -16.7684
    },
    {
        "day": 5,
        "name": "Porto Moniz",
        "query": "Piscinas Naturais Porto Moniz Madeira",
        "lat": 32.8624,
        "lng": -17.1683
    },
    {
        "day": 5,
        "name": "São Vicente",
        "query": "Grutas de São Vicente Madeira",
        "lat": 32.7976,
        "lng": -17.0316
    },
    {
        "day": 5,
        "name": "Paul da Serra",
        "query": "Paul da Serra Madeira plateau",
        "lat": 32.7629395,
        "lng": -17.0958911
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
