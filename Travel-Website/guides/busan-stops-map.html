<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Busan — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#a855a6">Day 4</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Songdo Sky Walk",
        "query": "Songdo Skywalk, Seo-gu, Busan",
        "lat": 35.075147,
        "lng": 129.023522
    },
    {
        "day": 1,
        "name": "Gamcheon Culture Village",
        "query": "Gamcheon Culture Village, Saha-gu, Busan",
        "lat": 35.0963371,
        "lng": 129.0087897
    },
    {
        "day": 1,
        "name": "Busan Tower",
        "query": "37-55 Yongdusan-gil, Jung-gu, Busan",
        "lat": 35.0999666,
        "lng": 129.0321792
    },
    {
        "day": 1,
        "name": "Taejongdae Park",
        "query": "Jeonmang-ro 24, Yeongdo-gu, Busan",
        "lat": 35.05851,
        "lng": 129.0876858
    },
    {
        "day": 2,
        "name": "Dongbaekseom",
        "query": "Dongbaek Island, Haeundae-gu, Busan",
        "lat": 35.1604271,
        "lng": 129.1546376
    },
    {
        "day": 2,
        "name": "Haeundae Beach",
        "query": "Haeundae Beach, Haeundae-gu, Busan",
        "lat": 35.1577809,
        "lng": 129.1581318
    },
    {
        "day": 2,
        "name": "Busan Cinema Center",
        "query": "120 Suyeonggangbyeon-daero, Haeundae-gu, Busan",
        "lat": 35.1712188,
        "lng": 129.1266587
    },
    {
        "day": 2,
        "name": "Gwangalli Beach",
        "query": "Gwangalli Beach, Suyeong-gu, Busan",
        "lat": 35.1508879,
        "lng": 129.1167806
    },
    {
        "day": 3,
        "name": "Geumjeongsanseong",
        "query": "Geumgang Park Cable Car, Dongnae-gu, Busan",
        "lat": 35.2514859,
        "lng": 129.0454231
    },
    {
        "day": 3,
        "name": "UN Memorial Cemetery",
        "query": "UN Memorial Cemetery in Korea, 93 UN Peace-ro, Nam-gu, Busan",
        "lat": 35.127682,
        "lng": 129.097664
    },
    {
        "day": 3,
        "name": "Oryukdo Sky Walk",
        "query": "Oryukdo Skywalk, Nam-gu, Busan",
        "lat": 35.1005721,
        "lng": 129.1247309
    },
    {
        "day": 4,
        "name": "Haedong Yonggungsa Temple",
        "query": "Haedong Yonggungsa 86 Yonggung-gil Gijang-gun Busan",
        "lat": 35.1881,
        "lng": 129.2243
    },
    {
        "day": 4,
        "name": "Beomeosa Temple",
        "query": "Beomeosa 250 Beomeosa-ro Geumjeong-gu Busan",
        "lat": 35.2915,
        "lng": 129.0618
    },
    {
        "day": 4,
        "name": "Dalmaji Hill",
        "query": "Dalmaji Hill Moontan Road Haeundae-gu Busan",
        "lat": 35.1699,
        "lng": 129.1785
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#a855a6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
