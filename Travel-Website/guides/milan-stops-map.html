<body>

<div id="filter-row">

<script src="/maps/vendor/leaflet.min.js"></script>

<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [

    },

        "lng": 9.1884071
    },
    {
        "day": 3,

    },

        "lng": 9.1789568
    },
    {
        "day": 2,

        "query": "Basilica di Sant'Ambrogio, Piazza Sant'Ambrogio 15, Milano",
        "lat": 45.4623754,
        "lng": 9.1758455
    },
    {
        "day": 2,

        "lat": 45.4659764,

    },
    {
        "day": 4,

        "query": "Parco Sempione, Piazza Sempione, Milano",
        "lat": 45.4716914,
        "lng": 9.177696
    },
    {
        "day": 2,
        "name": "Sforza Castle",
        "query": "Castello Sforzesco, Piazza Castello, Milano",
        "lat": 45.4703009,
        "lng": 9.1780912
    },
    {
        "day": 3,
        "name": "Navigli",
        "query": "Naviglio Grande, Navigli, Milano",
        "lat": 45.4480404,

    },
    {

        "query": "Basilica di San Lorenzo Maggiore, Corso di Porta Ticinese 39, Milano",
        "lat": 45.4580847,
        "lng": 9.1820113
    },
    {
        "day": 4,
        "name": "Cimitero Monumentale",
        "query": "Cimitero Monumentale, Piazzale Cimitero Monumentale, Milano",
        "lat": 45.4838983,
        "lng": 9.1772345
    },
    {
        "day": 4,
        "name": "Bosco Verticale",
        "query": "Bosco Verticale, Via Gaetano de Castillia 11, Milano",
        "lat": 45.4856111,
        "lng": 9.1904001
    },
    {
        "day": 1,
        "name": "Brera District",
        "query": "Via Fiori Chiari, Brera, Milano",
        "lat": 45.4721849,
        "lng": 9.1868528
    },
    {
        "day": 5,
        "name": "Piazza Vecchia",
        "query": "Piazza Vecchia, Bergamo",
        "lat": 45.704038,
        "lng": 9.6628983
    },
    {
        "day": 5,
        "name": "Cappella Colleoni",
        "query": "Cappella Colleoni, Bergamo",
        "lat": 45.703429,
        "lng": 9.6621174
    },
    {
        "day": 5,
        "name": "Venetian Walls",
        "query": "Viale delle Mura, Bergamo",
        "lat": 45.7063102,
        "lng": 9.658514
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
