<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Santiago — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>

<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>

<script>
const STOPS = [
    {
        "day": 4,
        "name": "Cerro Santa Lucía",
        "query": "Cerro Sta. Lucía 105 Lastarria",
        "lat": -33.4410506,

    },
    {
        "day": 3,
        "name": "La Chascona",
        "query": "Fernando Márquez de la Plata 0192 Bellavista",
        "lat": -33.4312595,
        "lng": -70.6341550
    },
    {
        "day": 2,
        "name": "Cerro San Cristóbal",
        "query": "Pío Nono 450 Recoleta",
        "lat": -33.429916,
        "lng": -70.6363824
    },
    {
        "day": 1,
        "name": "Plaza de Armas",
        "query": "Plaza de Armas Centro",
        "lat": -33.4378941,
        "lng": -70.6510923
    },
    {
        "day": 2,
        "name": "La Moneda",
        "query": "Moneda s/n Centro",
        "lat": -33.442821,
        "lng": -70.6542125
    },
    {
        "day": 4,
        "name": "Museo Precolombino",
        "query": "Bandera 361 Centro",
        "lat": -33.4390245,
        "lng": -70.6521952
    },
    {
        "day": 3,
        "name": "Estación Mapocho",
        "query": "Av. Balmaceda 1301 Centro",
        "lat": -33.4322761,
        "lng": -70.6531916
    },
    {
        "day": 3,
        "name": "Sky Costanera",
        "query": "Av. Andrés Bello 2457 Providencia",
        "lat": -33.4170565,
        "lng": -70.6067618
    },
    {
        "day": 1,
        "name": "Museo de la Memoria y los Derechos Humanos",
        "query": "Matucana 501 Quinta Normal Santiago",
        "lat": -33.4397436,
        "lng": -70.6794048
    },
    {
        "day": 1,
        "name": "Parque Quinta Normal",
        "query": "Matucana 520 Quinta Normal Santiago",
        "lat": -33.4400157,
        "lng": -70.6801073
    },
    {
        "day": 4,
        "name": "Palacio Cousiño",
        "query": "Dieciocho 438 Santiago",
        "lat": -33.4523832,
        "lng": -70.6565849
    },
    {
        "day": 5,
        "name": "Parque Forestal",
        "query": "Parque Forestal Lastarria Santiago",
        "lat": -33.4362254,
        "lng": -70.6392283
    },
    {
        "day": 5,
        "name": "Parque Bicentenario",
        "query": "Av. Bicentenario 3680 Vitacura Santiago",
        "lat": -33.4026771,
        "lng": -70.6016891
    },
    {
        "day": 5,
        "name": "Cerro Manquehue",
        "query": "Vía Roja 10300 Vitacura Santiago",
        "lat": -33.3661401,
        "lng": -70.5585636
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
