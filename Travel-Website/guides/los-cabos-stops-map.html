<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Los-Cabos — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>

<script>
const STOPS = [
    {
        "day": 1,
        "name": "El Arco",
        "query": "El Arco Land's End Cabo San Lucas",
        "lat": 22.8760239,
        "lng": -109.8945633
    },
    {

        "lat": 22.8950604,
        "lng": -109.8936195
    },
    {
        "day": 1,
        "name": "ATV Pacific Dunes",
        "query": "ATV desert adventure Pacific dunes Cabo San Lucas",
        "lat": null,
        "lng": null
    },
    {
        "day": 1,
        "name": "Cabo San Lucas Historic Center",
        "query": "Plaza Amelia Wilkes Centro Cabo San Lucas",
        "lat": 22.8827074,
        "lng": -109.9144516
    },
    {
        "day": 1,
        "name": "Santa Maria Bay",
        "query": "Santa Maria Bay Tourist Corridor Cabo San Lucas",
        "lat": 22.9334317,
        "lng": -109.8152718
    },
    {
        "day": 1,
        "name": "Chileno Bay",
        "query": "Playa Chileno Tourist Corridor Baja California Sur",
        "lat": 22.933863,
        "lng": -109.8164152
    },
    {
        "day": 2,
        "name": "Wild Canyon Adventures",
        "query": "Wild Canyon Adventures Carretera Transpeninsular Km 19.5",
        "lat": null,
        "lng": null
    },
    {
        "day": 2,
        "name": "Estero San José",
        "query": "Estero San Jose del Cabo Baja California Sur",
        "lat": 23.0642086,
        "lng": -109.6948857
    },
    {
        "day": 2,
        "name": "Todos Santos",
        "query": "Todos Santos historic center Baja California Sur",
        "lat": 23.0690769,
        "lng": -109.7195862
    },
    {
        "day": 3,
        "name": "Hotel California Todos Santos",
        "query": "Hotel California Todos Santos Baja California Sur",
        "lat": 23.4489673,
        "lng": -110.2255106
    },
    {
        "day": 2,
        "name": "Iglesia San José",
        "query": "Iglesia San Jose del Cabo plaza Baja California Sur",
        "lat": 23.0966425,
        "lng": -109.7262643
    },
    {
        "day": 3,
        "name": "Art District",
        "query": "Art District Calle Obregon San Jose del Cabo",
        "lat": null,
        "lng": null
    },
    {
        "day": 4,
        "name": "Cabo Pulmo National Park",
        "query": "Cabo Pulmo National Marine Park Baja California Sur",
        "lat": 23.4379644,
        "lng": -109.4056184
    },
    {
        "day": 4,
        "name": "Cabo Pulmo Village",
        "query": "Cabo Pulmo Village East Cape Baja California Sur",
        "lat": null,
        "lng": null
    },
    {
        "day": 4,
        "name": "Los Barriles",
        "query": "Los Barriles East Cape Baja California Sur",
        "lat": 22.8821291,
        "lng": -109.9137851
    },
    {
        "day": 4,
        "name": "East Cape Coast",
        "query": "East Cape coast Baja California Sur",
        "lat": null,
        "lng": null
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
