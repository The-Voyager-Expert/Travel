<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<link rel="stylesheet" href="/assets/mobile.css">
<link rel="stylesheet" href="/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="/assets/stops-map-style.css">
<title>Hanoi — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Hanoi — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 4,
        "name": "St. Joseph's Cathedral",
        "query": "40 Nha Chung Hoan Kiem Hanoi",
        "lat": 21.0279185,
        "lng": 105.8499427
    },
    {
        "day": 4,
        "name": "Hoa Lo Prison Museum",
        "query": "1 Hoa Lo Tran Hung Dao Hoan Kiem Hanoi",
        "lat": 21.0254222,
        "lng": 105.8465093
    },
    {
        "day": 4,
        "name": "Vietnamese Women's Museum",
        "query": "36 Ly Thuong Kiet Hoan Kiem Hanoi",
        "lat": 21.0233506,
        "lng": 105.8515958
    },
    {
        "day": 1,
        "name": "Imperial Citadel of Thang Long",
        "query": "19C Hoang Dieu Ba Dinh Hanoi",
        "lat": 21.0300856,
        "lng": 105.8385232
    },
    {
        "day": 4,
        "name": "Hanoi Flag Tower",
        "query": "Hanoi Flag Tower 28A Dien Bien Phu Hanoi",
        "lat": 21.0325903,
        "lng": 105.8398246
    },
    {
        "day": 1,
        "name": "Temple of Literature",
        "query": "58 Quoc Tu Giam Dong Da Hanoi",
        "lat": 21.0287903,
        "lng": 105.8359533
    },
    {
        "day": 3,
        "name": "Thang Long Water Puppet Theatre",
        "query": "57B Dinh Tien Hoang Hoan Kiem Hanoi",
        "lat": 21.0317043,
        "lng": 105.853455
    },
    {
        "day": 3,
        "name": "Ngoc Son Temple",
        "query": "Ngoc Son Temple Dinh Tien Hoang Hoan Kiem Hanoi",
        "lat": 21.0307719,
        "lng": 105.8533525
    },
    {
        "day": 3,
        "name": "Hanoi Opera House",
        "query": "1 Trang Tien Hoan Kiem Hanoi",
        "lat": 21.02414,
        "lng": 105.8597599
    },
    {
        "day": 3,
        "name": "Long Bien Bridge",
        "query": "Long Bien Bridge Hanoi",
        "lat": 21.0430652,
        "lng": 105.8580334
    },
    {
        "day": 2,
        "name": "Quan Thanh Temple",
        "query": "Quan Thanh Temple 190 Quan Thanh Hanoi",
        "lat": 21.0430059,
        "lng": 105.8365874
    },
    {
        "day": 2,
        "name": "Ho Chi Minh Mausoleum",
        "query": "Ho Chi Minh Mausoleum Ba Dinh Hanoi",
        "lat": 21.0367831,
        "lng": 105.8346888
    },
    {
        "day": 3,
        "name": "National Museum of Vietnamese History",
        "query": "1 Pham Ngu Lao Hoan Kiem Hanoi",
        "lat": 21.0233665,
        "lng": 105.8594196
    },
    {
        "day": 1,
        "name": "Vietnam National Museum of Fine Arts",
        "query": "66 Nguyen Thai Hoc Ba Dinh Hanoi",
        "lat": 21.0306418,
        "lng": 105.837036
    },
    {
        "day": 2,
        "name": "Vietnam Museum of Ethnology",
        "query": "Vietnam Museum of Ethnology Nguyen Van Huyen Cau Giay Hanoi",
        "lat": 21.0400774,
        "lng": 105.7988403
    },
    {
        "day": 2,
        "name": "Tran Quoc Pagoda",
        "query": "Tran Quoc Pagoda Thanh Nien Tay Ho Hanoi",
        "lat": 21.0478837,
        "lng": 105.8368375
    },
    {
        "day": 5,
        "name": "Hoa Lu Ancient Capital",
        "query": "Hoa Lu Ancient Capital Truong Yen Hoa Lu Ninh Binh",
        "lat": 20.283483,
        "lng": 105.8995986
    },
    {
        "day": 5,
        "name": "Tam Coc",
        "query": "Tam Coc Ninh Hai Hoa Lu Ninh Binh",
        "lat": 20.2150857,
        "lng": 105.9350262
    },
    {
        "day": 5,
        "name": "Hang Mua Peak",
        "query": "Hang Mua Peak Khe Dau Ha Ninh Xuan Ninh Binh",
        "lat": 20.2347635,
        "lng": 105.9417153
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
