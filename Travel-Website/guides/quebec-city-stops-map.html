<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Quebec-City — All Stops"></div>
<div id="filter-row">

  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>

<div id="map-wrap"><div id="map"></div></div>

<script>
const STOPS = [
    {
        "day": 2,
        "name": "Terrasse Dufferin",
        "query": "Terrasse Dufferin Quebec City",

        "lng": -71.2042853
    },
    {

    },
    {

        "lat": 46.8074905,
        "lng": -71.2076532
    },
    {
        "day": 1,
        "name": "Fortifications of Québec",
        "query": "Porte Saint-Louis Quebec City",
        "lat": 46.8094356,
        "lng": -71.2113047
    },
    {

        "query": "Observatoire de la Capitale 1037 rue de la Chevrotiere Quebec City",
        "lat": 46.8080416,
        "lng": -71.217802
    },
    {
        "day": 2,
        "name": "Funiculaire du Vieux-Québec",
        "query": "Funiculaire du Vieux-Quebec Terrasse Dufferin",
        "lat": 46.8125545,
        "lng": -71.2040047
    },
    {
        "day": 2,
        "name": "Escalier Casse-Cou",
        "query": "Escalier Casse-Cou Quebec City rue du Petit-Champlain",
        "lat": 46.8127674,
        "lng": -71.2035651
    },
    {
        "day": 2,
        "name": "Rue du Petit-Champlain",
        "query": "Rue du Petit-Champlain Quebec City",
        "lat": 46.811455,
        "lng": -71.203528
    },
    {
        "day": 2,
        "name": "Place Royale",
        "query": "Place Royale Quebec City Basse-Ville",
        "lat": 46.8131735,
        "lng": -71.202808
    },
    {
        "day": 3,
        "name": "Montmorency Falls",
        "query": "Parc de la Chute-Montmorency 2490 avenue Royale Beauport Quebec",
        "lat": 46.8869753,
        "lng": -71.1492913
    },
    {
        "day": 3,
        "name": "Basilique Sainte-Anne-de-Beaupré",
        "query": "Basilique Sainte-Anne-de-Beaupre 10018 avenue Royale",
        "lat": 47.0240793,
        "lng": -70.9283249
    },
    {
        "day": 3,
        "name": "Île d'Orléans",
        "query": "Pont de l ile d Orleans Saint-Pierre Quebec",
        "lat": 46.8793262,
        "lng": -71.1332793
    },
    {
        "day": 4,
        "name": "Plaines d'Abraham",
        "query": "Plaines d Abraham Parc des Champs-de-Bataille Quebec City",
        "lat": 46.7976555,
        "lng": -71.2288299
    },
    {
        "day": 4,
        "name": "Village Touristique Wendake",
        "query": "Village Touristique Wendake 575 rue Chef Nicolas-Vincent Wendake Quebec",
        "lat": 46.857004,
        "lng": -71.3580735
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
