<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../assets/web-travel-style.css">
<link rel="stylesheet" href="../../assets/mobile.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="../../assets/stops-map-style.css">
<title>Granada — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="3" data-maxwidth="1400" data-title="Granada — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../../Trip-Essentials/Maps/vendor/leaflet.min.js"></script>
<script src="../../Trip-Essentials/Maps/vendor/markercluster.min.js"></script>
<script src="../../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Alcazaba &amp; Nasrid Palaces",
        "query": "Calle Real de la Alhambra s/n, Granada",
        "lat": 37.1760482,
        "lng": -3.5887806
    },
    {
        "day": 1,
        "name": "Generalife",
        "query": "Calle Real de la Alhambra s/n, Granada",
        "lat": 37.1760482,
        "lng": -3.5887806
    },
    {
        "day": 1,
        "name": "Palace of Charles V",
        "query": "Calle Real de la Alhambra s/n, Granada",
        "lat": 37.1760482,
        "lng": -3.5887806
    },
    {
        "day": 2,
        "name": "Abadía del Sacromonte",
        "query": "Abadía del Sacromonte, Granada",
        "lat": 37.1831741,
        "lng": -3.5770997
    },
    {
        "day": 2,
        "name": "Albaicín",
        "query": "Albaicín, Granada",
        "lat": 37.1815692,
        "lng": -3.5946668
    },
    {
        "day": 2,
        "name": "Dar al-Horra Palace",
        "query": "Callejón de las Monjas, Albaicín, Granada",
        "lat": 37.181494,
        "lng": -3.5960504
    },
    {
        "day": 2,
        "name": "Mirador de San Nicolás",
        "query": "Mirador de San Nicolás, Albaicín, Granada",
        "lat": 37.1810405,
        "lng": -3.5926619
    },
    {
        "day": 3,
        "name": "Granada Cathedral",
        "query": "Gran Vía de Colón 5, Granada",
        "lat": 37.1829151,
        "lng": -3.6019539
    },
    {
        "day": 4,
        "name": "Capilla Real",
        "query": "Calle Oficios s/n, Granada",
        "lat": 37.1760087,
        "lng": -3.5986059
    },
    {
        "day": 3,
        "name": "Monasterio de la Cartuja",
        "query": "Paseo de Cartuja s/n, Granada",
        "lat": 37.1914167,
        "lng": -3.6009032
    },
    {
        "day": 3,
        "name": "Monasterio de San Jerónimo",
        "query": "Rector López Argüeta 9, Granada",
        "lat": 37.1793644,
        "lng": -3.6045062
    },
    {
        "day": 1,
        "name": "Bañuelo",
        "query": "Carrera del Darro 31, Granada",
        "lat": 37.1763,
        "lng": -3.5905
    },
    {
        "day": 4,
        "name": "Palacio de la Madraza",
        "query": "Oficios 14, Granada",
        "lat": 37.1762,
        "lng": -3.5981
    },
    {
        "day": 4,
        "name": "Corral del Carbón",
        "query": "Calle Mariana Pineda, Granada",
        "lat": 37.1756,
        "lng": -3.5996
    },
    {
        "day": 4,
        "name": "Alcaicería",
        "query": "Calle Alcaicería, Granada",
        "lat": 37.1762,
        "lng": -3.5992
    },
    {
        "day": 5,
        "name": "Carmen de los Mártires",
        "query": "Carmen de los Mártires, Alhambra, Granada",
        "lat": 37.1753,
        "lng": -3.5905
    },
    {
        "day": 5,
        "name": "Fundación Rodríguez-Acosta",
        "query": "Callejón Niño del Rollo, Realejo, Granada",
        "lat": 37.1731,
        "lng": -3.5921
    },
    {
        "day": 5,
        "name": "Huerta de San Vicente",
        "query": "Parque García Lorca, Calle Arabial, Granada",
        "lat": 37.171,
        "lng": -3.6058
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
