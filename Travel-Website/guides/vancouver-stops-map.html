<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Vancouver — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 3,
        "name": "Stanley Park",
        "query": "Stanley Park West End Vancouver",
        "lat": 49.3020684,
        "lng": -123.1413263
    },
    {
        "day": 1,
        "name": "Vancouver Lookout",
        "query": "555 W Hastings Street Downtown Vancouver",
        "lat": 49.2846668,
        "lng": -123.1119122
    },
    {
        "day": 1,
        "name": "Gastown",
        "query": "305 Water Street Gastown Vancouver",
        "lat": 49.2844685,
        "lng": -123.109004
    },
    {
        "day": 2,
        "name": "Capilano Suspension Bridge Park",
        "query": "3735 Capilano Road North Shore North Vancouver",
        "lat": 49.342704,
        "lng": -123.1160482
    },
    {
        "day": 2,
        "name": "Grouse Mountain",
        "query": "6400 Nancy Greene Way North Shore North Vancouver",
        "lat": 49.3794719,
        "lng": -123.0767805
    },
    {
        "day": 3,
        "name": "Shannon Falls Provincial Park",
        "query": "Shannon Falls Provincial Park Highway 99 Squamish BC",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Sea to Sky Gondola",
        "query": "36800 Highway 99 Squamish BC",
        "lat": 49.6731617,
        "lng": -123.143849
    },
    {
        "day": 4,
        "name": "VanDusen Botanical Garden",
        "query": "5251 Oak Street Shaughnessy Vancouver",
        "lat": 49.2441404,
        "lng": -123.1277894
    },
    {
        "day": 4,
        "name": "Bloedel Conservatory",
        "query": "4600 Cambie Street Mount Pleasant Vancouver",
        "lat": 49.2581009,
        "lng": -123.1150124
    },
    {
        "day": 1,
        "name": "Dr. Sun Yat-Sen Classical Chinese Garden",
        "query": "578 Carrall Street Chinatown Vancouver",
        "lat": 49.2798621,
        "lng": -123.1044094
    },
    {
        "day": 5,
        "name": "Granville Island",
        "query": "Granville Island Vancouver",
        "lat": 49.270713,
        "lng": -123.1342858
    },
    {
        "day": 5,
        "name": "Museum of Anthropology at UBC",
        "query": "6393 NW Marine Drive UBC Vancouver",
        "lat": 49.2694691,
        "lng": -123.2594145
    },
    {
        "day": 5,
        "name": "Nitobe Memorial Garden",
        "query": "1895 Lower Mall UBC Vancouver",
        "lat": 49.2634388,
        "lng": -123.2563782
    }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
