<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../assets/web-travel-style.css">
<link rel="stylesheet" href="../assets/mobile.css">
<link rel="stylesheet" href="../essentials/maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../essentials/maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="../assets/stops-map-style.css">
<title>Porto — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Porto — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../essentials/maps/vendor/leaflet.min.js"></script>
<script src="../essentials/maps/vendor/markercluster.min.js"></script>
<script src="../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "São Bento Railway Station",
        "query": "Praca Almeida Garrett 4000-069 Porto Portugal",
        "lat": 41.1459328,
        "lng": -8.6107784
    },
    {
        "day": 1,
        "name": "Palácio da Bolsa",
        "query": "Palacio da Bolsa Rua Ferreira Borges 4050-253 Porto Portugal",
        "lat": 41.1414113,
        "lng": -8.6157292
    },
    {
        "day": 1,
        "name": "Clérigos Tower",
        "query": "Rua de Sao Filipe de Nery 4050-546 Porto Portugal",
        "lat": 41.1457905,
        "lng": -8.6147574
    },
    {
        "day": 1,
        "name": "Ribeira Waterfront",
        "query": "Cais da Ribeira 4050-509 Porto Portugal",
        "lat": 41.1407025,
        "lng": -8.610778
    },
    {
        "day": 2,
        "name": "Dom Luís I Bridge",
        "query": "Ponte Luis I Porto Portugal",
        "lat": 41.1401696,
        "lng": -8.6094576
    },
    {
        "day": 2,
        "name": "Vila Nova de Gaia — Port Wine Cellars",
        "query": "Cais de Gaia Vila Nova de Gaia 4400 Portugal",
        "lat": 41.1378593,
        "lng": -8.6193008
    },
    {
        "day": 2,
        "name": "Douro River — Six Bridges Cruise",
        "query": "Cais de Gaia Vila Nova de Gaia Portugal",
        "lat": 41.1378593,
        "lng": -8.6193008
    },
    {
        "day": 3,
        "name": "Coliseu do Porto",
        "query": "Coliseu do Porto Rua de Passos Manuel 137 Porto Portugal",
        "lat": 41.1471403,
        "lng": -8.6051922
    },
    {
        "day": 3,
        "name": "Capela das Almas",
        "query": "Capela das Almas Rua de Santa Catarina 428 Porto Portugal",
        "lat": 41.1498571,
        "lng": -8.6056923
    },
    {
        "day": 3,
        "name": "Igreja de Santo Ildefonso",
        "query": "Igreja de Santo Ildefonso Praca da Batalha Porto Portugal",
        "lat": 41.1425058,
        "lng": -8.6092307
    },
    {
        "day": 3,
        "name": "Sé do Porto",
        "query": "Se do Porto Terreiro da Se Porto Portugal",
        "lat": 41.1427992,
        "lng": -8.6112059
    },
    {
        "day": 4,
        "name": "Crystal Palace Gardens",
        "query": "Jardins do Palacio de Cristal Rua de Dom Manuel II 4050-346 Porto Portugal",
        "lat": 41.1482682,
        "lng": -8.6255165
    },
    {
        "day": 4,
        "name": "Casa da Música",
        "query": "Casa da Musica Avenida da Boavista 604 4149-071 Porto Portugal",
        "lat": 41.1589025,
        "lng": -8.6307748
    },
    {
        "day": 4,
        "name": "Serralves",
        "query": "Serralves Rua Dom Joao de Castro 210 4150-417 Porto Portugal",
        "lat": 41.1590425,
        "lng": -8.6593536
    },
    {
        "day": 4,
        "name": "Foz do Douro",
        "query": "Pergola da Foz Avenida do Brasil Porto Portugal",
        "lat": 41.1514067,
        "lng": -8.6702023
    },
    {
        "day": 5,
        "name": "Historic Centre of Guimarães",
        "query": "Largo da Oliveira 4800-441 Guimaraes Portugal",
        "lat": 41.4429013,
        "lng": -8.29287
    },
    {
        "day": 5,
        "name": "Palace of the Dukes of Braganza",
        "query": "Paco dos Duques de Braganca Rua Conde Dom Henrique 4800-412 Guimaraes Portugal",
        "lat": 41.4464847,
        "lng": -8.2908072
    },
    {
        "day": 5,
        "name": "Castle of Guimarães",
        "query": "Castelo de Guimaraes Rua Conde Dom Henrique 4800-412 Guimaraes Portugal",
        "lat": 41.4478935,
        "lng": -8.2903191
    },
    {
        "day": 5,
        "name": "Monte da Penha",
        "query": "Santuario da Penha Rua da Penha 4810-038 Guimaraes Portugal",
        "lat": 41.431827,
        "lng": -8.2700682
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
