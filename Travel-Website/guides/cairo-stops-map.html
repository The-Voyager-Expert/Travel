<body>
<div data-toolbar data-depth="1" data-maxwidth="1400" data-title="Cairo — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#C04E1A">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="/maps/vendor/leaflet.min.js"></script>
<script src="/maps/vendor/markercluster.min.js"></script>
<script src="/assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
  {
    "day": 1,
    "name": "Grand Egyptian Museum",
    "query": "Grand Egyptian Museum El Remayah Square Giza",
    "lat": 29.9945754,
    "lng": 31.1190738
  },
  {
    "day": 1,
    "name": "Giza Pyramid Complex",
    "query": "Pyramids of Giza Al Haram Street",
    "lat": 29.9791647,
    "lng": 31.1342133
  },
  {
    "day": 1,
    "name": "Saqqara",
    "query": "Saqqara Necropolis Mit Rahina",
    "lat": 30.0722285,
    "lng": 31.0154475
  },
  {
    "day": 2,
    "name": "Cairo Citadel",
    "query": "Citadel of Saladin Mokattam Hills",
    "lat": 30.0292997,
    "lng": 31.2615831
  },
  {
    "day": 2,
    "name": "Mosque-Madrassa of Sultan Hassan",
    "query": "Mosque Madrassa Sultan Hassan Salah al-Din Square",
    "lat": 30.032409,
    "lng": 31.256236
  },
  {
    "day": 2,
    "name": "Al-Azhar Park",
    "query": "Al-Azhar Park Salah Salem Street al-Darb al-Ahmar",
    "lat": 30.0401004,
    "lng": 31.2640801
  },
  {
    "day": 3,
    "name": "Coptic Cairo",
    "query": "Coptic Quarter Mar Girgis Fustat",
    "lat": 30.0064658,
    "lng": 31.2318439
  },
  {
    "day": 3,
    "name": "Khan el-Khalili",
    "query": "Khan el-Khalili El-Hussein Square al-Gamaliyya",
    "lat": 30.0489382,
    "lng": 31.2613383
  },
  {
    "day": 3,
    "name": "Egyptian Museum",
    "query": "Egyptian Museum Tahrir Square Qasr al-Nil",
    "lat": 30.0479664,
    "lng": 31.2336093
  },
  {
    "day": 4,
    "name": "Manial Palace",
    "query": "Manial Palace Rhoda Island al-Manial",
    "lat": 30.027031,
    "lng": 31.228129
  },
  {
    "day": 4,
    "name": "Mosque of Ibn Tulun",
    "query": "Mosque of Ibn Tulun Ahmad Ibn Tulun Square Sayyida Zaynab",
    "lat": 30.0287138,
    "lng": 31.2502469
  },
  {
    "day": 4,
    "name": "Gayer-Anderson Museum",
    "query": "Gayer-Anderson Museum Ibn Tulun Square Sayyida Zaynab",
    "lat": 30.0283804,
    "lng": 31.2507258
  },
  {
    "day": 4,
    "name": "Cairo Tower",
    "query": "Cairo Tower Gezira Island Zamalek",
    "lat": 30.0460136,
    "lng": 31.2243131
  },
  {
    "day": 5,
    "name": "Bibliotheca Alexandrina",
    "query": "Bibliotheca Alexandrina Chatby Alexandria",
    "lat": 31.2086605,
    "lng": 29.9089329
  },
  {
    "day": 5,
    "name": "Citadel of Qaitbay",
    "query": "Citadel of Qaitbay Ras el-Tin Alexandria",
    "lat": 31.213679,
    "lng": 29.885413
  },
  {
    "day": 5,
    "name": "Montaza Palace Gardens",
    "query": "Montaza Palace Gardens Montaza Alexandria",
    "lat": 31.284921,
    "lng": 30.015435
  }
];
const DAY_COLORS = {"1": "#C04E1A", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#C04E1A';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
