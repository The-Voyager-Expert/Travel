<!DOCTYPE html>
<html lang="en">
<head>

<title>Weather by City — Month-by-Month Averages | Guide My Days</title>
<style>/* OWNER-DIRECTED 2026-08-12: the banner and intro card used to live INSIDE
   .wx-wrap, so they were squeezed into the 460px result column and looked
   nothing like the banner on every other page — the heading wrapped over two
   lines and the intro ran as a narrow ribbon. They now sit in the shared .wrap
   lane from web-travel-style.css (max-width:none, 32px gutters) — the very same
   element every other page uses, so this banner cannot drift from them — while
   .wx-wrap keeps its 460px for the weather panel itself.
   Banner full width, result centred. */
.wx-wrap { max-width: 460px; margin: 10px auto 0; padding: 0 14px; }
.wx-panel { background: var(--warm, #fdf8f0); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 6px 26px rgba(0,0,0,.10); padding: 18px 18px 20px; }
.wx-eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.wx-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
input.wx-city { flex: 1; width: 100%; min-width: 0; font-family: inherit; font-size: 16px; font-weight: 400; color: var(--text);
  padding: 6px 8px 6px 36px; border: 1.5px solid var(--border2, #e6e2da); border-radius: 6px; margin-bottom: 0; margin-top: 14px; }
.wx-unit { display: inline-flex; border: 1.5px solid var(--border2, #e6e2da); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
.wx-unit button { display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; padding: 6px 11px; font-size: 13px; font-weight: 400;
  font-family: inherit; background: transparent; color: var(--muted, #6a6660); }
.wx-unit button.on { background: var(--surface,#ffffff); color: var(--rust,#C04E1A); }
/* Scoped to this page only — .sa-row is the shared TVESearch dropdown row used
   on 70+ pages, so its own base rule (padding:9px 14px, font-size:14px,
   font-weight:600) stays untouched globally. Brain/Reference/Toolbar-Nav/TVESearch.html
   is the canonical spec: dropdown rows are NOT icon-aligned to the input above
   them — they get their own flat 12px 16px padding and 13px font, independent
   of the input's 36px icon inset. Weight only is dropped to regular to match
   the de-bolded input text per owner request. */
#wx-panel .sa-row { padding: 12px 16px; font-size: 13px; font-weight: 400; }
#wx-panel[hidden] { display: none !important; }
.wx-month { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
.wx-bignums { display: flex; justify-content: center; gap: 28px; margin-top: 6px; }
.wx-bignums .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.wx-bignums .val { font-size: 34px; font-weight: 700; line-height: 1.1; }
.wx-hi .lbl, .wx-hi .val { color: var(--c-temp-hi); }
.wx-lo .lbl, .wx-lo .val { color: var(--c-temp-lo); }
.wx-divider { width: 1px; background: var(--border); }
.wx-chart { margin-top: 18px; display: flex; align-items: flex-end; gap: 2px; }
.wx-col { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; }
.wx-coltrack { position: relative; width: 100%; display: flex; justify-content: center; }
.wx-bar { position: absolute; width: 7px; border-radius: 4px; background: color-mix(in srgb, var(--rust) 30%, transparent); }
.wx-bar.on { background: #C04E1A; }
.wx-collab { font-size: 9px; margin-top: 4px; color: var(--muted); }
.wx-collab.on { color: var(--rust); font-weight: 700; }
.wx-hint { margin-top: 6px; font-size: 12px; text-align: center; color: var(--muted); }
.wx-mongrid { margin-top: 14px; display: grid; grid-template-columns: repeat(6,1fr); gap: 5px; }
.wx-mon { display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--border2, #e6e2da); border-radius: 6px; cursor: pointer; padding: 10px 0; font-size: 13px; font-weight: 400;
  font-family: inherit; background: var(--surface); color: var(--muted, #6a6660); transition: background .12s,color .12s,border-color .12s; }
.wx-mon:hover { border-color: var(--rust); background: var(--bg,#f5f4f0); font-weight: 600; }
.wx-mon.on { background: var(--surface,#ffffff); color: var(--rust,#C04E1A); border-color: var(--rust); }
.wx-rain { display: flex; justify-content: center; gap: 22px; margin-top: 14px;
  padding: 10px 0 0; border-top: 1px solid var(--border2); }
.wx-rain .rlbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--c-rain); }
.wx-rain .rval { font-size: 22px; font-weight: 700; color: var(--c-rain); line-height: 1.1; }
.wx-note { color: var(--muted); font-size: 11px; margin-top: 14px; text-align: center; }
/* ── Hero (2026-08-14) — the Before-You-Go pattern, same tokens and sizes, so
   the redesigned pages read as one system. ── */
.wx-hero { max-width: 1120px; margin: 0 auto; padding: clamp(2rem, 5.5vw, 4rem) 24px clamp(1.2rem, 2.5vw, 1.8rem); text-align: center; }
.wx-kicker { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--rust, #C04E1A); margin: 0 0 .6rem; }
.wx-hero-h { font-size: clamp(2.1rem, 5.4vw, 3.9rem); line-height: 1.0; letter-spacing: -.035em;
  font-weight: 700; color: var(--text, #17150f); margin: 0 auto clamp(.7rem, 1.6vw, 1.05rem);
  max-width: 20ch; text-wrap: balance; }
.wx-hero-h em { font-style: normal; color: var(--rust, #C04E1A); }
.wx-hero-sub { font-size: clamp(.95rem, 1.25vw, 1.1rem); line-height: 1.6; color: var(--muted, #6a6660);
  max-width: 56ch; margin: 0 auto clamp(1.4rem, 3vw, 2rem); }
.wx-search { position: relative; display: flex; align-items: center; gap: 10px;
  max-width: 680px; margin: 0 auto; background: var(--surface, #fff);
  border: 1.5px solid var(--border2, #e6e2da); border-radius: 999px;
  padding: 6px 8px 6px 22px; box-shadow: 0 6px 26px rgba(92, 61, 17, .07);
  transition: border-color .18s ease, box-shadow .18s ease; }
.wx-search:focus-within { border-color: var(--rust, #C04E1A); box-shadow: 0 8px 30px rgba(192, 78, 26, .16); }
.wx-search-icon { line-height: 0; flex-shrink: 0; color: var(--rust, #C04E1A); }
.wx-search input.search-input, input.wx-city {
  flex: 1; min-width: 0; height: 56px; margin: 0; padding: 0 4px;
  font-family: inherit; font-size: clamp(1rem, 1.5vw, 1.18rem); font-weight: 500;
  color: var(--text, #17150f); background: transparent; border: none; border-radius: 0;
  outline: none; box-shadow: none; }
.wx-search input::placeholder { color: #a8a29a; font-weight: 400; }
.wx-search input:focus, .wx-search input:focus-visible { border: none !important; box-shadow: none !important; }
.wx-search .sa-suggest { left: 0; right: 0; top: calc(100% + 14px); border-radius: 14px; text-align: left; }
/* Inside the white hero pill the panel's "on" state (white fill, rust text) is
   invisible — it needs a tint to read as selected. */
.wx-search .wx-unit { flex-shrink: 0; border-radius: 999px; }
.wx-search .wx-unit button { padding: 9px 14px; font-weight: 600; }
.wx-search .wx-unit button.on { background: var(--bg, #f0ede8); color: var(--rust, #C04E1A); }
@media (max-width: 700px) {
  .wx-hero { padding-top: 1.5rem; }
  .wx-search { padding-left: 16px; gap: 6px; }
  .wx-search input.search-input { height: 48px; }
}
@media (prefers-color-scheme: dark) {
  /* --c-temp-hi #e05030 is 4.05:1 on #242220 (warm bg) — not AA; lighten to #f07050 (5.0:1) */
  :root { --c-temp-hi: #f07050; }
}
:root[data-theme="dark"] { --c-temp-hi: #f07050; }
</style>

<!-- Banner + intro card deleted and the page rebuilt around its search
     (owner 2026-08-14: "delete all that" · "we need to do a cool here for this
     one too"). Same move as Before-You-Go: the headline is the readout — it
     names the city you picked instead of repeating the page title — and the
     search leaves the 460px panel to become the widest thing on the page.
     Weather.html is a FORMAT_EXCEPTION page, so the banner is not coming back. -->
<div class="wx-hero">
  <p class="wx-kicker">Weather by city</p>
  <h1 class="wx-hero-h" id="wx-hero-h">Every destination, <em>month by month</em>.</h1>
  <p class="wx-hero-sub" id="wx-hero-sub">Typical highs, lows and rainfall through the year — the shape of the whole year, not a single number.</p>
  <div class="wx-search">
    <span class="wx-search-icon"><svg style="display:block" width="19" height="19" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><line x1="9.35" y1="9.35" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <div id="wx-search-wrap" style="position:relative;flex:1;min-width:0;display:flex">
      <input type="search" class="search-input" id="wx-city-search" placeholder="City or country" aria-label="Search for a city" autocomplete="off">
    </div>
    <div class="wx-unit" id="wx-unit">
      <button data-u="C" aria-label="Celsius">°C</button>
      <button data-u="F" aria-label="Fahrenheit">°F</button>
    </div>
  </div>
</div>

<div class="wx-wrap">
  <div class="wx-panel" id="wx-panel" hidden></div>
  <!-- The two glued strips that sat here are gone (owner 2026-08-14: "these
       should all be removed — it is ugly and repetitive"). The top pair read as
       one offer twice over (Climate finder IS the When to Go tab), and the
       six-link Forecast & Research block is the same block that sits at the foot
       of Climate-Finder. Weather by city now ends on its own content, and the
       When to Go hero carries the link back. -->
</div>

<script>
(function () {
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG = ['January','February','March','April','May','June','July',
                     'August','September','October','November','December'];
  var panel = document.getElementById('wx-panel');
  var DB = {}, cityKeys = [];
  var curKey = null, selMonth = new Date().getMonth();

  function unit() { try { return localStorage.getItem('guideTempUnit') === 'F' ? 'F' : 'C'; } catch (e) { return 'C'; } }
  function setUnit(u) { try { localStorage.setItem('guideTempUnit', u); } catch (e) {} }
  function conv(c) { return unit() === 'F' ? Math.round(c * 9 / 5 + 32) : Math.round(c); }

  /* The panel no longer builds a header: the search and the unit toggle live in
     the hero above it and are wired ONCE, not rebuilt on every render — a
     re-created input loses focus mid-typing and drops the TVESearch binding. */
  function paintHero() {
    var h = document.getElementById('wx-hero-h');
    var sub = document.getElementById('wx-hero-sub');
    var cityName = DB[curKey] ? (DB[curKey].city || curKey) : '';
    if (!h || !sub) return;
    if (cityName) {
      h.innerHTML = cityName + ', <em>month by month</em>.';
      sub.textContent = 'Typical highs, lows and rainfall in ' + cityName +
        ' through the year — long-run averages, not a forecast.';
    } else {
      h.innerHTML = 'Every destination, <em>month by month</em>.';
      sub.textContent = 'Typical highs, lows and rainfall through the year — the shape of the whole year, not a single number.';
    }
  }

  function paintUnit() {
    var u = unit();
    document.querySelectorAll('#wx-unit button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.u === u);
    });
  }

  function body() {
    var rec = DB[curKey];
    var hi = conv(rec.hi[selMonth]) + '°' + unit();
    var lo = conv(rec.lo[selMonth]) + '°' + unit();

    var vals = [];
    for (var i = 0; i < 12; i++) { vals.push(rec.hi[i]); vals.push(rec.lo[i]); }
    var lo0 = Math.min.apply(null, vals), hi0 = Math.max.apply(null, vals);
    var span = (hi0 - lo0) || 1, H = 86, bars = '';
    for (var j = 0; j < 12; j++) {
      var on = (j === selMonth);
      var top = (1 - (rec.hi[j] - lo0) / span) * H;
      var bot = (1 - (rec.lo[j] - lo0) / span) * H;
      var barH = Math.max(3, bot - top);
      bars += '<div class="wx-col" data-mon="' + j + '">' +
          '<div class="wx-coltrack" style="height:' + H + 'px;">' +
            '<div class="wx-bar' + (on ? ' on' : '') + '" style="top:' + top + 'px;height:' + barH + 'px;"></div>' +
          '</div>' +
          '<div class="wx-collab' + (on ? ' on' : '') + '">' + MONTHS[j][0] + '</div>' +
        '</div>';
    }

    var grid = MONTHS.map(function (mo, k) {
      return '<button class="wx-mon' + (k === selMonth ? ' on' : '') + '" data-mon="' + k + '">' + mo + '</button>';
    }).join('');

    var rainRow = '';
    if (rec.rain && rec.rd) {
      var mm = rec.rain[selMonth] || 0;
      var rd = rec.rd[selMonth] || 0;
      rainRow = '<div class="wx-rain">' +
        '<div style="text-align:center;"><div class="rlbl">Rain</div><div class="rval">' + mm + '<span style="font-size:13px;font-weight:400;"> mm</span></div></div>' +
        '<div class="wx-divider"></div>' +
        '<div style="text-align:center;"><div class="rlbl">Rainy days</div><div class="rval">' + rd + '</div></div>' +
      '</div>';
    }

    return '<div class="wx-month">' + MONTHS_LONG[selMonth] + '</div>' +
      '<div class="wx-bignums">' +
        '<div class="wx-hi" style="text-align:center;"><div class="lbl">High</div><div class="val">' + hi + '</div></div>' +
        '<div class="wx-divider"></div>' +
        '<div class="wx-lo" style="text-align:center;"><div class="lbl">Low</div><div class="val">' + lo + '</div></div>' +
      '</div>' + rainRow +
      '<div class="wx-chart">' + bars + '</div>' +
      '<div class="wx-hint">Tap a month · avg daily high/low</div>' +
      '<div class="wx-mongrid">' + grid + '</div>';
  }

  function render() {
    /* No city -> the card does not exist. It is NOT rendered empty: .wx-panel is
       a raised card (cream fill, border, 26px shadow) sized by its content, so an
       empty one is a blank banner floating under the search. */
    if (!DB[curKey]) {
      panel.innerHTML = '';
      panel.hidden = true;
      paintHero();
      paintUnit();
      return;
    }
    panel.hidden = false;
    panel.innerHTML = body();
    paintHero();
    paintUnit();
    panel.querySelectorAll('.wx-col').forEach(function (c) {
      c.addEventListener('click', function () { selMonth = +c.dataset.mon; render(); });
    });
    panel.querySelectorAll('.wx-mon').forEach(function (b) {
      b.addEventListener('click', function () { selMonth = +b.dataset.mon; render(); });
    });
  }

  /* Wired once — these elements are in the page, not rebuilt by render(). */
  document.querySelectorAll('#wx-unit button').forEach(function (b) {
    b.addEventListener('click', function () { setUnit(b.dataset.u); render(); });
  });

  var data = window.TravelClimate || {};
  Object.keys(data).forEach(function (k) {
    if (k === '_meta' || k === '_generated' || !data[k] || !data[k].hi) return;
    DB[k] = data[k];
  });

  /* The "Updated {Month} {Year}" stamp this block painted into #wx-updated is
     gone (owner 2026-08-16): the stamp renders on the stats pages only. The
     element it wrote into is deleted too, so nothing here reads _generated. */
  cityKeys = Object.keys(DB).sort(function (a, b) { return (DB[a].city || a).localeCompare(DB[b].city || b); });
  /* `sub` is the country, and it is not decoration: TVESearch matches on name OR
     sub, so this is what makes typing "Japan" list Tokyo, Kyoto and Osaka the way
     it does in every other search on the site. Without it this page was the one
     city-only search left — a country query returned nothing. The country rides
     in the baked climate data as `co` (build_climate.py). */
  var tveItems = cityKeys.map(function (k) {
    return { name: DB[k].city || k, sub: DB[k].co || '', key: k };
  });
  if (cityKeys.length) {
    /* NOTHING is selected on arrival (owner 2026-08-16) — same rule as the Time
       Zones home base, and the same reason: any starting city is a place the
       reader is not. It preferred 'Seattle' (the owner's own), then fell back to
       whatever sorted first alphabetically, which is how the page came to open on
       Abu Dhabi. Both are arbitrary; the reader searches.

       A #City hash still selects — the 237 guides deep-link that way. */
    var hashKey = decodeURIComponent(location.hash.slice(1));
    curKey = (hashKey && cityKeys.indexOf(hashKey) >= 0) ? hashKey : null;
    var inp0 = document.getElementById('wx-city-search');
    if (inp0) inp0.value = DB[curKey] ? (DB[curKey].city || curKey) : '';
    if (window.TVESearch && inp0) {
      TVESearch.attach(inp0, { items: tveItems, onPick: function (it) { curKey = it.key; render(); } });
    }
    render();
  } else {
    panel.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);">Could not load climate data.</div>';
  }
})();
</script>
