<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../assets/web-travel-style.css">
<link rel="stylesheet" href="../../assets/mobile.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/MarkerCluster.min.css">
<title>Big-Island — All Stops Map</title>
<link rel="stylesheet" href="../../assets/stops-map-style.css">
</head>
<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="Big-Island — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#8b5cf6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#10b981">Day 5</button>
  <button class="day-btn" data-day="6" style="--dc:#f59e0b">Day 6</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../../Trip-Essentials/Maps/vendor/leaflet.min.js"></script>
<script src="../../Trip-Essentials/Maps/vendor/markercluster.min.js"></script>
<script src="../../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 3,
        "name": "Hawaiʻi Volcanoes National Park",
        "query": "1 Crater Rim Drive Hawaii Volcanoes National Park HI",
        "lat": 19.4287122,
        "lng": -155.2583238
    },
    {
        "day": 1,
        "name": "Punaluʻu Black Sand Beach",
        "query": "Ninole Loop Road Pahala Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 1,
        "name": "Manta Ray Night Snorkel",
        "query": "Keauhou Bay 78-128 Ehukai Street Kailua-Kona Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 2,
        "name": "Puʻuhonua o Hōnaunau National Historical Park",
        "query": "Hwy 160 Honaunau Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 4,
        "name": "Kealakekua Bay",
        "query": "Napoopoo Road Captain Cook Hawaii",
        "lat": 19.4404383,
        "lng": -155.8814623
    },
    {
        "day": 2,
        "name": "Mauna Kea",
        "query": "Maunakea Visitor Information Station Mauna Kea Access Road Hilo Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Waipiʻo Valley Lookout",
        "query": "Waipio Valley Lookout Honokaa Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Pololu Valley Lookout",
        "query": "Pololu Valley Lookout Kapaau Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Akaka Falls State Park",
        "query": "Akaka Falls State Park Honomu Hawaii",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Rainbow Falls",
        "query": "Rainbow Falls Hilo Hawaii",
        "lat": 19.7194808,
        "lng": -155.1095939
    },
    {
        "day": 4,
        "name": "Ka Lae",
        "query": "South Point Road Naalehu Hawaii",
        "lat": 18.9101,
        "lng": -155.6757
    },
    {
        "day": 1,
        "name": "Papakolea Green Sand Beach",
        "query": "Papakolea Green Sand Beach Naalehu Hawaii",
        "lat": 18.9219,
        "lng": -155.6489
    },
    {
        "day": 2,
        "name": "Kīholo Bay",
        "query": "Kiholo Bay Hwy 19 Kailua-Kona Hawaii",
        "lat": 19.8929,
        "lng": -155.9561
    },
    {
        "day": 5,
        "name": "Puako Petroglyph Preserve",
        "query": "Holoholokai Beach Park 1 Kaniku Drive Waikoloa Hawaii",
        "lat": 19.9393,
        "lng": -155.8682
    },
    {
        "day": 5,
        "name": "Lapakahi State Historical Park",
        "query": "Lapakahi State Historical Park Hwy 270 Kapaau Hawaii",
        "lat": 20.0964,
        "lng": -155.8288
    },
    {
        "day": 5,
        "name": "Moʻokini Heiau",
        "query": "Mookini Heiau Upolu Airport Road Hawi Hawaii",
        "lat": 20.2288,
        "lng": -155.8429
    },
    {
        "day": 6,
        "name": "Ahu'ena Heiau",
        "query": "75-5660 Palani Rd Kailua-Kona Hawaii",
        "lat": 19.6413,
        "lng": -155.9959
    },
    {
        "day": 6,
        "name": "Hulihe'e Palace",
        "query": "75-5718 Alii Drive Kailua-Kona Hawaii",
        "lat": 19.6389,
        "lng": -155.9967
    },
    {
        "day": 6,
        "name": "Holualoa Village",
        "query": "Holualoa Hawaii",
        "lat": 19.6143,
        "lng": -155.9392
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#8b5cf6", "5": "#10b981", "6": "#f59e0b"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
