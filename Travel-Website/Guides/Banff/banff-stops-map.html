<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../assets/web-travel-style.css">
<link rel="stylesheet" href="../../assets/mobile.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/leaflet.min.css">
<link rel="stylesheet" href="../../Trip-Essentials/Maps/vendor/MarkerCluster.min.css">
<link rel="stylesheet" href="../../assets/stops-map-style.css">
<title>Banff — All Stops Map</title>
</head>
<body>
<div data-toolbar data-depth="2" data-maxwidth="1400" data-title="Banff — All Stops"></div>
<div id="filter-row">
  <button class="day-btn active" data-day="all">All days</button>
  <button class="day-btn" data-day="1" style="--dc:#b85c2a">Day 1</button>
  <button class="day-btn" data-day="2" style="--dc:#4a90d9">Day 2</button>
  <button class="day-btn" data-day="3" style="--dc:#7ab648">Day 3</button>
  <button class="day-btn" data-day="4" style="--dc:#9b59b6">Day 4</button>
  <button class="day-btn" data-day="5" style="--dc:#e67e22">Day 5</button>
</div>
<div id="map-wrap"><div id="map"></div></div>
<script src="../../Trip-Essentials/Maps/vendor/leaflet.min.js"></script>
<script src="../../Trip-Essentials/Maps/vendor/markercluster.min.js"></script>
<script src="../../assets/toolbar.js?v=100"></script>
<script>
const STOPS = [
    {
        "day": 1,
        "name": "Bow Falls",
        "query": "Bow Falls, Banff, AB",
        "lat": 51.1674103,
        "lng": -115.5609012
    },
    {
        "day": 1,
        "name": "Surprise Corner",
        "query": "Surprise Corner, Buffalo St, Banff, AB",
        "lat": 51.1676228,
        "lng": -115.5598284
    },
    {
        "day": 1,
        "name": "Fairmont Banff Springs",
        "query": "Fairmont Banff Springs, 405 Spray Ave, Banff, AB",
        "lat": 51.1640762,
        "lng": -115.5617749
    },
    {
        "day": 1,
        "name": "Cave and Basin National Historic Site",
        "query": "Cave and Basin National Historic Site, 311 Cave Ave, Banff, AB",
        "lat": null,
        "lng": null
    },
    {
        "day": 2,
        "name": "Moraine Lake",
        "query": "Moraine Lake, Lake Louise, AB",
        "lat": 51.3298104,
        "lng": -116.1809806
    },
    {
        "day": 2,
        "name": "Lake Louise",
        "query": "Lake Louise, Banff National Park, AB",
        "lat": 51.4255193,
        "lng": -116.178962
    },
    {
        "day": 2,
        "name": "Johnston Canyon",
        "query": "Johnston Canyon, Bow Valley Pkwy, Banff National Park, AB",
        "lat": null,
        "lng": null
    },
    {
        "day": 3,
        "name": "Vermilion Lakes",
        "query": "Vermilion Lakes, Banff, AB",
        "lat": 51.1843374,
        "lng": -115.5906486
    },
    {
        "day": 3,
        "name": "Banff Gondola",
        "query": "Banff Gondola, 100 Mountain Ave, Banff, AB",
        "lat": 51.1479016,
        "lng": -115.5554466
    },
    {
        "day": 3,
        "name": "Whyte Museum of the Canadian Rockies",
        "query": "Whyte Museum of the Canadian Rockies, 111 Bear St, Banff, AB",
        "lat": 51.1752949,
        "lng": -115.5733363
    },
    {
        "day": 3,
        "name": "Banff Upper Hot Springs",
        "query": "Banff Upper Hot Springs, 1 Mountain Ave, Banff, AB",
        "lat": 51.1508639,
        "lng": -115.5605979
    },
    {
        "day": 4,
        "name": "Bow Lake",
        "query": "Bow Lake, Icefields Parkway, Banff National Park, AB",
        "lat": 51.6736,
        "lng": -116.4584
    },
    {
        "day": 4,
        "name": "Peyto Lake",
        "query": "Peyto Lake, Bow Summit, Banff National Park, AB",
        "lat": 51.7247,
        "lng": -116.5073
    },
    {
        "day": 4,
        "name": "Mistaya Canyon",
        "query": "Mistaya Canyon, Icefields Parkway, Banff National Park, AB",
        "lat": 51.9025,
        "lng": -116.619
    },
    {
        "day": 5,
        "name": "Lake Minnewanka",
        "query": "Lake Minnewanka, Banff, AB",
        "lat": 51.2527,
        "lng": -115.4833
    },
    {
        "day": 5,
        "name": "Bankhead",
        "query": "Bankhead Historic Site, Minnewanka Loop Rd, Banff, AB",
        "lat": 51.2167,
        "lng": -115.555
    },
    {
        "day": 5,
        "name": "Mount Norquay",
        "query": "Banff Norquay, 2 Mount Norquay Rd, Banff, AB",
        "lat": 51.2027,
        "lng": -115.5932
    }
];
const DAY_COLORS = {"1": "#b85c2a", "2": "#4a90d9", "3": "#7ab648", "4": "#9b59b6", "5": "#e67e22"};

const map = L.map('map', {zoomControl: true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a> \u00a9 <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const cluster = L.markerClusterGroup({maxClusterRadius: 40, showCoverageOnHover: false});
const markers = [];

function pinIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,0.35)"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -12]
  });
}

STOPS.filter(s => s.lat != null && s.lng != null).forEach(s => {
  const color = DAY_COLORS[String(s.day)] || '#b85c2a';
  const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.query);
  const marker = L.marker([s.lat, s.lng], {icon: pinIcon(color)});
  marker.bindPopup(
    '<div class="stop-popup">' +
    '<strong>' + s.name + '</strong>' +
    '<span class="day-tag" style="background:' + color + '">Day ' + s.day + '</span><br>' +
    '<a href="' + mapsUrl + '" target="_blank">Open in Google Maps</a>' +
    '</div>'
  );
  marker._day = s.day;
  markers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

function fitVisible(list) {
  if (!list.length) return;
  map.fitBounds(L.latLngBounds(list.map(m => m.getLatLng())), {padding: [44, 44]});
}
fitVisible(markers);

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const day = btn.dataset.day;
    cluster.clearLayers();
    const visible = day === 'all' ? markers : markers.filter(m => String(m._day) === day);
    visible.forEach(m => cluster.addLayer(m));
    fitVisible(visible);
  });
});
</script>
</body>
</html>
