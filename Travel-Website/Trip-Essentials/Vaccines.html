<title>Vaccines</title>
<style>/* ── Search ── */
.search-wrap { display: flex; justify-content: center; margin: 35px 0 16px; }
.search-wrap input { margin-bottom: 0; }
/* ── Legend (dot-inside-family-pill standard) ── */
.tier-legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 18px;
}
.tleg {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.5;
  text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
  border: 1px solid; white-space: nowrap;
}
.tleg-lbl { display: inline-flex; align-items: center; gap: 6px; }
.tleg-lbl::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: currentColor;
}
/* Legend dots use canonical sphere mid tones per Badge spec 2026-07-29. */
.tleg.req { background: #fdf0e8; color: #7a3a1a; border-color: #e8c0a0; }
.tleg.req .tleg-lbl::before { background: #e01818; }  /* 🔴 sphere mid */
.tleg.rec { background: #e8f5e8; color: #1a5a1a; border-color: #9ad09a; }
.tleg.rec .tleg-lbl::before { background: #5eb833; }  /* 🟢 sphere mid */
.tleg.con { background: #e8f0fb; color: var(--navy); border-color: #c5d5ee; }
.tleg.con .tleg-lbl::before { background: #4a90e2; }  /* 🔵 sphere mid */
.tleg.med { background: #fff8e0; color: #7a5800; border-color: #e8c870; }
.tleg.med .tleg-lbl::before { background: #f5c518; }  /* 🟡 sphere mid */
@media (prefers-color-scheme: dark) {
  .tleg.req { background: #2a1408; color: #e8a880; border-color: #7a4020; }
  .tleg.req .tleg-lbl::before { background: #e8a880; }
  .tleg.rec { background: #0d200d; color: #5aaa5e; border-color: #3a7a3a; }
  .tleg.rec .tleg-lbl::before { background: #5aaa5e; }
  .tleg.con { background: #0a1a3a; color: #93b4ff; border-color: #3a5a9a; }
  .tleg.con .tleg-lbl::before { background: #93b4ff; }
  .tleg.med { background: #281f00; color: #d4a830; border-color: #7a6010; }
  .tleg.med .tleg-lbl::before { background: #d4a830; }
}
/* ── Region pills ── */
.region-bar {
  display: flex; flex-wrap: wrap; gap: 6px;
  justify-content: center; margin-bottom: 24px;
}
.rpill {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: inherit; padding: 6px 14px; border-radius: 6px; border: 1.5px solid var(--border);
  background: var(--surface); font-size: 13px; font-weight: 400; color: var(--muted, #6a6660);
  cursor: pointer; transition: all .15s; white-space: nowrap; user-select: none;
}
.rpill:hover { border-color: var(--rust); color: var(--text); }
.rpill.active {
  background: linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%); border-color: var(--rust);
  color: #fff; font-weight: 600;
}

/* Desktop-only FORMATTING + BEHAVIOR per Brain/Reference/Formatting/Formatting.html#src-desktoppill.
   .region-bar (15 pills) → balanced 8+7 rows via flex-basis calc(100%/8).
   .tier-legend (4 family-colored legend badges) → natural-width strip
   CENTERED, squared corners, touching borders — family bg/text/border trios
   preserved (they encode meaning). Mobile grid + base states untouched. */
@media (min-width: 601px) {
  .region-bar { gap: 0; }
  .rpill { flex: 1 1 calc(100% / 8 - 0.01px); height: 36px; padding: 0 14px; font-size: 13px; font-weight: 500; line-height: 1; color: #3d3a32; border-radius: 0; margin-left: 0; background: var(--surface, #ffffff); border: 1.5px solid var(--border2, #e6e2da); }
  .rpill:hover { background: var(--bg, #f5f4f0); border-color: var(--rust); }
  .rpill.active { background: #f0ede8; border: 1.5px solid var(--border2, #e6e2da); color: var(--muted); font-weight: 500; }
  .tier-legend { gap: 0; justify-content: center; }
  .tleg { height: 36px; padding: 0 14px; font-size: 11px; font-weight: 700; line-height: 1; border-width: 1.5px; border-radius: 0; margin-left: 0; }
}
/* ── Destination panel ── */
#dest-panel { margin-bottom: 28px; }
#dest-panel.hidden { display: none; }
.dest-header {
  font-size: 15px; font-weight: 700; color: var(--text);
  margin-bottom: 4px;
}
.dest-countries {
  font-size: 12px; color: var(--muted); margin-bottom: 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
@media (min-width: 601px) {
  .guide-pills { gap: 0; }
  .guide-pill { flex: 1 1 auto; height: 36px; padding: 0 14px; font-size: 13px; font-weight: 500; line-height: 1; color: var(--text, #3d3a32); border-radius: 0; margin-left: 0; background: var(--surface, #ffffff); border: 1.5px solid var(--border2, #e6e2da); }
  .guide-pill:hover { background: var(--bg, #f5f4f0); border-color: var(--rust, #b85c2a); }
}
@media (max-width: 600px) {
  .guide-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .guide-pill { height: 46px; padding: 4px 6px; border-radius: 0; font-size: 12px; white-space: normal; line-height: 1.12; display: flex; align-items: center; justify-content: center; text-align: center; }
}
/* ── Vaccine cards ── */
.vc-grid { display: flex; flex-direction: column; gap: 8px; }
.vc-card {
  display: grid; grid-template-columns: 200px 1fr; gap: 0 16px;
  border-radius: 8px; padding: 12px 15px;
  background: var(--surface); border: 1px solid var(--border2); border-left: 4px solid;
}
/* Bars use canonical family sphere mid tones per Badge spec 2026-07-29. */
.vc-card.req  { border-left-color: #e01818; }  /* 🔴 sphere mid */
.vc-card.rec  { border-left-color: #5eb833; }  /* 🟢 sphere mid */
.vc-card.con  { border-left-color: #4a90e2; }  /* 🔵 sphere mid */
.vc-card.med  { border-left-color: #f5c518; }  /* 🟡 sphere mid */
.vc-left { display: flex; flex-direction: column; gap: 3px; }
.vc-name { font-size: 13px; font-weight: 700; color: var(--text); }
.vc-badge {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.5;
  text-transform: uppercase; padding: 1px 5px; border-radius: 3px; width: fit-content; white-space: nowrap;
}
.req .vc-badge  { background: #fdf0e8; color: #7a3a1a; border: 1px solid rgba(122,58,26,0.4); }
.rec .vc-badge  { background: #e8f5e8; color: #1a5a1a; border: 1px solid rgba(26,90,26,0.4); }
.con .vc-badge  { background: #e8f0fb; color: var(--navy); border: 1px solid rgba(26,58,139,0.4); }
.med .vc-badge  { background: #fff8e0; color: #7a5800; border: 1px solid rgba(122,88,0,0.4); }
@media (prefers-color-scheme: dark) {
  .req .vc-badge { background: #2a1408; color: #e8a880; border-color: #7a4020; }
  .con .vc-badge { background: #0a1a3a; color: #93b4ff; border-color: #3a5a9a; }
}
.vc-note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.vc-note strong { color: var(--text); }
/* ── Section labels ── */
.section-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); margin: 24px 0 10px;
}
/* ── Routine chips ── */
.routine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.routine-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 9px 12px; font-size: 12px; font-weight: 600; color: var(--text);
}
.routine-chip span { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
/* ── Timing / info bars ── */
.info-bar {
  margin-top: 14px; padding: 11px 14px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 12px; color: var(--muted); line-height: 1.6;
}
.info-bar strong { color: var(--text); }
.info-bar + .info-bar { margin-top: 8px; }
/* ── Search results ── */
.search-row {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 15px; margin-bottom: 8px; display: none;
}
.search-row.match { display: block; }
.sr-name { font-size: 13px; font-weight: 700; }
.sr-dest { font-size: 11px; color: var(--muted); margin-top: 1px; }
.sr-note { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
#search-panel { display: none; }
#search-panel.active { display: block; }
#main-ui.hidden { display: none; }
#no-results { display: none; }
/* .empty-state / -icon / -text live in web-travel-style.css (shared) */
@media (max-width: 600px) {
  .search-wrap input { width: 100%; }
  .vc-card { grid-template-columns: 1fr; gap: 4px 0; }
  /* Tier legend — Form B glued 2×2 grid on mobile so all 4 legend items
     stretch full-width with matching height. Family bg/text/border colors
     preserved (they encode meaning). */
  .tier-legend { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 0 !important; width: 100% !important; }
  .tleg { min-height: 46px !important; height: auto !important; padding: 6px 4px !important; border-radius: 0 !important; font-size: 10px !important;
    border: 2px solid var(--border, #d8d4cc) !important;
    line-height: 1.15 !important; display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important; letter-spacing: 0.03em !important; }
  .tleg:nth-child(even) { margin-left: -2px !important; }
  .tleg:nth-child(n+3) { margin-top: -2px !important; }
  .tleg .tleg-lbl { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  /* Form B glued 3-across grid — full width, no gaps, square corners, 46px. */
  .region-bar { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 0 !important; width: 100% !important; }
  .rpill { height: 46px !important; padding: 4px 6px !important; border-radius: 0 !important; font-size: 12px !important; white-space: normal !important; line-height: 1.12 !important; display: flex !important; align-items: center !important; justify-content: center !important; text-align: center !important; }
}</style>

      { type:'rec', name:'Meningococcal (MenACWY)', badge:'Recommended', note:'Essential for travel through the <strong>African meningitis belt</strong> — a band stretching from Senegal to Ethiopia (Burkina Faso, Chad, Mali, Niger, Nigeria, northern Ghana and Cameroon). Risk peaks during dry season (December–June). Single dose of MenACWY vaccine. Also required for Hajj/Umrah in Saudi Arabia.' },

function cardHTML(c) {

    '</div>';

function renderAll() {

  html += cardHTML({ type:'rec', name:'Hepatitis B', badge:'Recommended', note:'Recommended for most international travel, especially trips over 1 month or to destinations with limited medical infrastructure. Spread through blood, bodily fluids, and contaminated medical equipment. 3-dose series (0, 1, 6 months); faster 2-dose schedule (Heplisav-B) gives full protection in 1 month.' });
  html += cardHTML({ type:'rec', name:'Typhoid', badge:'Recommended', note:'Recommended for South and Southeast Asia, sub-Saharan Africa, North Africa, Latin America, and the Middle East — especially if eating at local restaurants or street food. India and Nepal have among the highest typhoid rates worldwide. Single injection (effective in 2 weeks) or 4-dose oral course.' });

  html += '<div class="info-bar"><strong>Documentation:</strong> Carry the International Certificate of Vaccination (yellow card) for any trip to sub-Saharan Africa, South America, or Saudi Arabia — border officials check it for Yellow Fever and Meningococcal. Digital records are not universally accepted at border crossings.</div>';
  return html;
}

function renderRegion(key) {
  var r = REGIONS[key];
  if (!r) return '';
  var html = '<div class="dest-header">' + r.label + '</div>';
  html += '<div class="dest-countries">' + r.countries + '</div>';
  if (r.guides && r.guides.length) {
    html += '<div class="region-guides">';
    html += '<div class="region-guides-toggle"><span class="chev">&#8250;</span> Guides in this region (' + r.guides.length + ')</div>';
    html += '<div class="region-guides-body"><div class="guide-pills">';
    r.guides.forEach(function(g) { html += '<a class="guide-pill" href="' + g.href + '">' + g.city + '<span class="guide-pill-chev">&#8250;</span></a>'; });
    html += '</div></div>';
    html += '</div>';
  }
  html += '<div class="vc-grid">';
  r.cards.forEach(function(c) { html += cardHTML(c); });
  html += '</div>';
  return html;
}

document.getElementById('region-bar').addEventListener('click', function(e) {
  var pill = e.target.closest('.rpill');
  if (!pill) return;
  document.querySelectorAll('.rpill').forEach(function(p) { p.classList.remove('active'); });
  pill.classList.add('active');
  var region = pill.dataset.region;
  if (region === 'all') {
    destPanel.classList.add('hidden');
    destPanel.innerHTML = '';
  } else {
    destPanel.innerHTML = renderRegion(region);
    destPanel.classList.remove('hidden');
    destPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
});

destPanel.addEventListener('click', function(e) {
  var toggle = e.target.closest('.region-guides-toggle');
  if (!toggle) return;
  toggle.classList.toggle('open');
  toggle.nextElementSibling.classList.toggle('open');
});

var searchInput = document.getElementById('vc-search');
var searchPanel = document.getElementById('search-panel');
var mainUI = document.getElementById('main-ui');
var noResults = document.getElementById('no-results');
var searchRows = document.getElementById('search-rows');

searchInput.addEventListener('input', function() {
  var q = searchInput.value.trim().toLowerCase();
  if (!q) {
    searchPanel.classList.remove('active');
    mainUI.classList.remove('hidden');
    noResults.style.display = 'none';
    return;
  }
  searchPanel.classList.add('active');
  mainUI.classList.add('hidden');
  var matches = ALL_SEARCH.filter(function(r) {
    return (r.name + r.dest + r.note).toLowerCase().indexOf(q) !== -1;
  });
  noResults.style.display = matches.length === 0 ? 'block' : 'none';
  searchRows.innerHTML = matches.map(function(r) {
    return '<div class="search-row match"><div class="sr-name">' + r.name + '</div><div class="sr-dest">' + r.dest + '</div><div class="sr-note">' + r.note + '</div></div>';
  }).join('');
});

<script src="../assets/search-autocomplete.js?v=8"></script>
<script>(function(){
  if(!window.TVESearch) return;
  var input=document.getElementById('vc-search'); if(!input) return;
  var all=window.ALL_SEARCH||[];
  var blob=all.map(function(r){return (r.name+' '+r.dest+' '+r.note);}).join(' ').toLowerCase();
  var items=[], seen={};
  function add(nm,sub){ nm=(nm||'').trim(); if(!nm) return; var k=nm.toLowerCase(); if(seen[k]) return; seen[k]=1; items.push({name:nm,sub:sub}); }
  all.forEach(function(r){ add(r.name, r.dest); });
  var regs=window.REGIONS||{};
  Object.keys(regs).forEach(function(k){
    var r=regs[k];
    if(r.label && blob.indexOf(r.label.toLowerCase())>=0) add(r.label,'Destination');
    (r.countries||'').split(/[,·]/).forEach(function(part){
      var nm=part.replace(/\([^)]*\)/g,'').replace(/\band\b.*/i,'').trim();
      if(nm && nm.length>2 && blob.indexOf(nm.toLowerCase())>=0) add(nm,'Destination');
    });
  });
  TVESearch.attach(input,{items:items});
}());</script>
