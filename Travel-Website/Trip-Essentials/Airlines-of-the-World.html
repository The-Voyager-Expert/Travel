<style>
  footer, .tb-footnote { display: none !important; }

  /* ── Search + filter stack ── */
  .al-search-wrap { padding: 14px 32px 0; display: flex; justify-content: center; }
  .al-search {
    width: 360px; max-width: 100%;
    padding: 8px 12px;
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border2, #e6e2da);
    border-radius: 6px;
  }
  .al-search:focus { outline: none; border-color: var(--rust, #b85c2a); }

  .controls {
    max-width: none; margin: 0 auto; padding: 10px 32px 0;
    display: flex; gap: 7px; flex-wrap: wrap; align-items: center; justify-content: center;
  }
  .filter-label {
    font-size: var(--fs-sub,12px); letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--muted); margin-right: 4px;
  }
  .filter-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border2, #e6e2da);
    color: var(--muted, #6a6660); font-weight: 400;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; line-height: 1;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
.filter-btn:hover {
    background: var(--bg,#f5f4f0); border-color: var(--rust);
  }
.filter-btn.active {
    background: var(--surface,#ffffff);
    color: var(--rust,#b85c2a); border-color: var(--rust);
  }
  @media (min-width: 601px), (pointer: fine) {
    .controls { gap: 0; }
    .filter-btn { flex: 0 1 auto; height: 36px; padding: 0 14px; font-size: 13px; font-weight: 500; line-height: 1; color: #3d3a32; border: 1.5px solid var(--border2, #e6e2da); border-radius: 0; margin-left: 0; background: var(--surface, #ffffff); }
    .filter-btn:hover { background: var(--bg, #f5f4f0); border-color: var(--rust); color: var(--text, #3d3a32); }
    .filter-btn.active,
    .filter-btn.active:hover,
    .filter-btn.active:focus { background: var(--surface,#ffffff); border: 1.5px solid var(--rust); color: var(--rust,#b85c2a); }
  }
  .al-chip-n { font-size: 11px; color: var(--muted); margin-left: 5px; }
  .filter-btn.active .al-chip-n { color: var(--muted); }

  .al-count { text-align: center; font-size: 12.5px; color: var(--muted); padding: 12px 32px 0; }

  /* ── Cards ── */
  main { padding: 16px 32px 32px; max-width: none; }
  .al-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; align-items: stretch; }
  .al-card {
    display: flex; flex-direction: column;
    background: var(--surface, #ffffff);
    border: 1px solid var(--border); border-radius: 5px; overflow: hidden;
    transition: box-shadow .18s, transform .18s, border-color .15s;
  }
  .al-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(138,108,26,0.10); transform: translateY(-1px); }
  .card-top {
    padding: 14px 18px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px; background: var(--surface2);
  }
  .card-flag { font-size: 26px; line-height: 1; flex-shrink: 0; margin-top: 1px; }
  .card-meta { flex: 1; min-width: 0; }
  .card-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.2; }
  .card-name a { color: inherit; text-decoration: none; }
  .card-name a:hover { color: var(--rust, #b85c2a); }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .card-tag {
    display: inline-flex; align-items: center;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap; line-height: 1.5;
  }
  .tag-star     { background: #e8f0fb; color: var(--navy); border-color: rgba(26,58,139,0.35); }
  .tag-skyteam  { background: #e0f0ff; color: #0a4a8a; border-color: rgba(10,74,138,0.35); }
  .tag-oneworld { background: #fff8e0; color: #7a5800; border-color: rgba(122,88,0,0.35); }
  .tag-indep    { background: var(--surface2); color: #5a544a; border-color: rgba(90,84,74,0.35); }
  .tag-full     { background: #f3e8ff; color: #7c3aed; border-color: rgba(124,58,237,0.35); }
  .tag-lcc      { background: #e8f5e8; color: #1a5a1a; border-color: rgba(26,90,26,0.35); }
  .tag-regional { background: #e8f8f0; color: #0a5a30; border-color: rgba(10,90,48,0.35); }
  .tag-leisure  { background: #ffe8f0; color: #8a1a3a; border-color: rgba(138,26,58,0.35); }
  .tag-longhaul { background: #fef3e2; color: #8a4a10; border-color: rgba(138,74,16,0.4); }

  .card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 0; flex: 1; }
  .card-desc { font-size: 13px; color: var(--text); line-height: 1.55; margin-bottom: 12px; }
  .info-rows { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
  .info-row { display: flex; gap: 8px; align-items: flex-start; }
  .info-icon { font-size: 14px; line-height: 1.4; flex-shrink: 0; width: 18px; text-align: center; }
  .info-content { font-size: 12.5px; color: var(--text); line-height: 1.45; }
  .info-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); display: block; margin-bottom: 1px;
  }
  .booking-section {
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border2);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .booking-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); flex-shrink: 0;
  }
  .booking-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .book-link {
    display: inline-flex; align-items: center; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 4px; text-decoration: none; transition: all .15s;
    border: 1px solid; background: var(--surface2); color: var(--text); border-color: var(--border2);
  }
  .book-link:hover { background: #fdf0e8; border-color: var(--rust, #b85c2a); color: var(--rust, #b85c2a); }

  /* ── Section + country headings ── */
  .al-region { margin-bottom: 30px; }
  .al-region-head {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border2); margin-bottom: 16px;
  }
  .al-country { margin-bottom: 18px; }
  .al-country-head {
    font-size: 12.5px; font-weight: 700; color: var(--text);
    letter-spacing: 0.04em; margin-bottom: 9px;
  }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }

  @media (max-width: 600px) and (pointer: coarse) {
    main { padding: 14px 14px 28px; }
    .al-grid { grid-template-columns: 1fr; }
    .controls { padding: 8px 14px 0; }
    /* Form B glued grid — two columns, not the shared three. Region and
       alliance labels carry a count and run long ("Latin America 31"); at
       three across they wrap to two and three lines and the tiles stop
       matching each other. Two columns keeps every label on one line. */
    .controls.filter-chip-row { grid-template-columns: repeat(2, 1fr) !important; gap: 0 !important; }
    .controls.filter-chip-row .filter-btn {
      min-height: 46px !important; height: auto !important;
      font-size: 12px !important; border-radius: 0 !important;
      padding: 4px 6px !important; line-height: 1.25 !important;
      display: inline-flex !important; align-items: center !important; justify-content: center !important;
      border: 1px solid var(--border2, #e6e2da) !important;
    }
    .al-search-wrap { padding: 12px 14px 0; }
    .al-count { padding: 10px 14px 0; }
  }
</style>

<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function tagsHTML(a) {
  var out = '';
  var al = ALLIANCES[a.al] || ALLIANCES['Independent'];
  out += '<span class="card-tag ' + al.cls + '">' + al.label + '</span>';
  (a.t || []).forEach(function(k) {
    var ty = TYPES[k];
    if (ty) out += '<span class="card-tag ' + ty.cls + '">' + ty.label + '</span>';
  });
  return out;
}

function cardHTML(a) {
  var host = a.w.replace(/^https?:\/\//, '').replace(/\/$/, '');
  return '' +
  '<div class="al-card">' +
    '<div class="card-top">' +
      '<div class="card-flag">' + a.f + '</div>' +
      '<div class="card-meta">' +
        '<div class="card-name"><a href="' + a.w + '" target="_blank" rel="noopener">' + esc(a.n) + '</a></div>' +
        '<div class="card-tags">' + tagsHTML(a) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-desc">' + esc(a.d) + '</div>' +
      '<div class="info-rows">' +
        '<div class="info-row"><div class="info-content">' +
          '<span class="info-label">Headquarters</span>' + esc(a.hq) + '</div></div>' +
        '<div class="info-row"><div class="info-content">' +
          '<span class="info-label">Main hubs</span>' + esc(a.hub) + '</div></div>' +
        '<div class="info-row"><div class="info-content">' +
          '<span class="info-label">Fleet</span>' + esc(a.fl) + '</div></div>' +
        '<div class="info-row"><div class="info-content">' +
          '<span class="info-label">Known for</span>' + esc(a.k) + '</div></div>' +
      '</div>' +
      '<div class="booking-section">' +
        '<span class="booking-label">Website</span>' +
        '<div class="booking-links">' +
          '<a href="' + a.w + '" target="_blank" rel="noopener" class="book-link">' + esc(host) + '</a>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

var alRegion = 'All', alAlliance = 'All';

function matches(a) {
  if (alRegion !== 'All' && a.r !== alRegion) return false;
  if (alAlliance !== 'All' && a.al !== alAlliance) return false;
  var q = (document.getElementById('al-search').value || '').trim().toLowerCase();
  if (!q) return true;
  return [a.n, a.c, a.hq, a.hub, a.al, a.d, a.k].join(' ').toLowerCase().indexOf(q) !== -1;
}

function render() {
  var res = document.getElementById('al-results');
  var cnt = document.getElementById('al-count');
  var list = AIRLINES.filter(matches);
  var q = (document.getElementById('al-search').value || '').trim();
  var noResults = list.length === 0;

  // No-results state: only the title, the search box and the message remain.
  document.getElementById('al-region-filters').style.display   = noResults ? 'none' : '';
  document.getElementById('al-alliance-filters').style.display = noResults ? 'none' : '';
  var also = document.getElementById('also-on-this-site');
  if (also) also.style.display = noResults ? 'none' : '';

  if (noResults) {
    cnt.textContent = '';
    res.innerHTML = '<div class="empty-state">No airline matches “' + esc(q) + '”.</div>';
    return;
  }

  cnt.innerHTML = '<strong>' + list.length + '</strong> airline' + (list.length === 1 ? '' : 's')
                + ' · <strong>' + new Set(list.map(function(a) { return a.c; })).size + '</strong> countries';

  var html = '';
  REGIONS.forEach(function(region) {
    var inRegion = list.filter(function(a) { return a.r === region; });
    if (!inRegion.length) return;
    html += '<div class="al-region"><div class="al-region-head">' + esc(region)
          + ' · ' + inRegion.length + '</div>';
    var countries = Array.from(new Set(inRegion.map(function(a) { return a.c; })))
                         .sort(function(x, y) { return x.localeCompare(y); });
    countries.forEach(function(country) {
      var cards = inRegion.filter(function(a) { return a.c === country; })
                          .sort(function(x, y) { return x.n.localeCompare(y.n); });
      html += '<div class="al-country"><div class="al-country-head">' + cards[0].f + ' ' + esc(country) + '</div>'
            + '<div class="al-grid">' + cards.map(cardHTML).join('') + '</div></div>';
    });
    html += '</div>';
  });
  res.innerHTML = html;
}

function buildChips(mountId, values, current, setter) {
  var mount = document.getElementById(mountId);
  mount.innerHTML = '';
  values.forEach(function(v) {
    var b = document.createElement('button');
    b.className = 'filter-btn' + (v.key === current() ? ' active' : '');
    var n = v.key === 'All' ? AIRLINES.length : AIRLINES.filter(v.test).length;
    b.innerHTML = esc(v.label) + ' <span class="al-chip-n">' + n + '</span>';
    b.onclick = function() {
      setter(v.key);
      document.getElementById('al-search').value = '';
      buildAllChips();
      render();
    };
    mount.appendChild(b);
  });
}

function buildAllChips() {
  buildChips('al-region-filters',
    [{ key:'All', label:'All regions', test:function() { return true; } }].concat(
      REGIONS.map(function(r) {
        /* Chip label only — the section heading keeps the full region name. */
        var short = r === 'Latin America & Caribbean' ? 'Latin America' : r;
        return { key:r, label:short, test:function(a) { return a.r === r; } };
      })),
    function() { return alRegion; },
    function(v) { alRegion = v; });

  buildChips('al-alliance-filters',
    [{ key:'All', label:'All alliances', test:function() { return true; } }].concat(
      Object.keys(ALLIANCES).map(function(k) {
        return { key:k, label:ALLIANCES[k].label, test:function(a) { return a.al === k; } };
      })),
    function() { return alAlliance; },
    function(v) { alAlliance = v; });
}

var alInput = document.getElementById('al-search');

function runQuery(q) {
  alInput.value = q;
  alRegion = 'All';
  alAlliance = 'All';
  buildAllChips();
  render();
}

alInput.addEventListener('input', function() { runQuery(alInput.value); });

/* Shared typeahead — every search box on the site uses TVESearch (Toolbar.html
   § TVESearch). Items are the airlines themselves plus the countries they fly
   from, so a reader typing "Qatar" is offered both the airline and the country. */
if (window.TVESearch) {
  var seen = {};
  var items = AIRLINES.map(function(a) { return { name: a.n, sub: a.c }; });
  AIRLINES.forEach(function(a) {
    if (!seen[a.c]) { seen[a.c] = 1; items.push({ name: a.c, sub: a.r }); }
  });
  TVESearch.attach(alInput, { items: items, onPick: function(it) { runQuery(it.name); } });
}

buildAllChips();
render();
</script>
