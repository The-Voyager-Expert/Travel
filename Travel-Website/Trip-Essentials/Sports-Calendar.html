<style>
/* Page-specific styles only — inherits base from web-travel-style.css */
.sc-wrap { padding: 0 32px; margin: 35px auto 0; }
.sc-siblings { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px; }
/* Controls */
.sc-controls { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 12px rgba(92,61,17,.07); margin-bottom: 22px; }
.sc-ctrl-label { font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 9px; }

/* Month grid */
.sc-month-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
.sc-mon {
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border2); border-radius: 6px; cursor: pointer;
  padding: 9px 2px; font-family: inherit; font-size: 11.5px; font-weight: 400; color: var(--muted, #6a6660);
  background: var(--surface,#ffffff); text-align: center; line-height: 1.25;
  transition: background .12s, color .12s, border-color .12s;
}
.sc-mon:hover { border-color: var(--rust); color: #fff; background: linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%); font-weight: 600; }
.sc-mon.on { background: linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%); color: #fff; border-color: var(--rust); font-weight: 600; }
@media (min-width: 601px) {
  .sc-month-grid { gap: 0; }
  .sc-mon { padding: 10px 2px; border-width: 1.5px; border-radius: 0; margin-left: 0; color: #3d3a32; font-weight: 500; background: var(--surface, #ffffff); }
  .sc-mon:hover { background: var(--bg, #f5f4f0); border-color: var(--rust); font-weight: 500; color: inherit;}
  .sc-mon.on,
  .sc-mon.on:hover,
  .sc-mon.on:focus { background: #f0ede8; border: 1.5px solid var(--border); color: var(--muted); font-weight: 500; }
}
.sc-mon-abbr { display: block; font-size: 12px; }

/* Sport filter */
.sc-sport-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
.sc-sport-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border: 1.5px solid var(--border2); border-radius: 20px; cursor: pointer;
  padding: 5px 12px; font-family: inherit; font-size: 12px; font-weight: 400; color: var(--muted);
  background: var(--surface, #fff); transition: border-color .12s, color .12s, background .12s;
}
.sc-sport-btn:hover { border-color: var(--rust); }
.sc-sport-btn.on { background: var(--rust, #b85c2a); border-color: var(--rust); color: #fff; font-weight: 600; }


/* Section headings */
.sc-section-head { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; padding-bottom: 9px; border-bottom: 2px solid var(--border2); }
.sc-section-title { font-size: 15px; font-weight: 700; color: var(--text); }
.sc-section-count { font-size: var(--fs-label); color: var(--muted); margin-left: auto; letter-spacing: .04em; }

/* Event cards */
.sc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.sc-card {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 11px;
  padding: 15px 16px; box-shadow: 0 1px 6px rgba(92,61,17,.05);
}
a.sc-card {
  display: block; color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
a.sc-card:hover { border-color: var(--rust); box-shadow: 0 3px 10px rgba(184,92,42,.12); }
.sc-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.sc-city { font-size: var(--fs-body); font-weight: 700; color: var(--text); }
a.sc-card:hover .sc-city { color: var(--rust); }
.sc-flag-country { font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.5; flex-shrink: 0; }
.sc-sport-tag {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 4px; margin-bottom: 6px;
  background: rgba(184,92,42,.08); color: var(--rust); border: 1px solid rgba(184,92,42,.2);
}
.sc-event-name { font-size: 13px; font-weight: 700; color: var(--rust); margin-bottom: 3px; }
.sc-dates { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: .02em; }
.sc-desc { font-size: var(--fs-sub); color: var(--text); line-height: 1.5; }
.sc-no-guide .sc-city { color: var(--muted); }

/* No-events notice */
.sc-none { color: var(--muted); font-size: var(--fs-sub); padding: 14px 0 4px; }

/* City search */
.sc-search-wrap { display: flex; justify-content: center; margin-bottom: 16px; }

@media (max-width: 600px) {
  .sc-wrap { padding: 0 14px; }
  .sc-month-grid { grid-template-columns: repeat(6, 1fr); }
  .sc-grid { grid-template-columns: 1fr; }
  .sc-siblings { display: grid; grid-template-columns: repeat(2, 1fr); }
  .sc-siblings .sibling-pill { justify-content: center; text-align: center; }
  .sc-sport-row { grid-template-columns: repeat(3, 1fr); }
}
</style>

/* ── Sport types ──────────────────────────────────────────────── */
const SPORT_TYPES = ['All','Tennis','F1','Football','Rugby','Marathon','Cycling','Other'];
const SPORT_ICONS = { All:'🏅', Tennis:'🎾', F1:'🏎️', Football:'⚽', Rugby:'🏉', Marathon:'🏃', Cycling:'🚴', Other:'🐎' };

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let activeMon   = null;
let activeSport = 'All';
let activeCity  = null;

function initMonths() {
  const grid = document.getElementById('sc-months');
  MONTHS.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'sc-mon';
    btn.innerHTML = `<span class="sc-mon-abbr">${m}</span>`;
    btn.setAttribute('aria-label', MONTH_FULL[i]);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sc-mon').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      activeMon  = i;
      activeCity = null;
      const inp = document.getElementById('sc-city-search');
      if (inp) inp.value = '';
      renderMonthResults();
    });
    grid.appendChild(btn);
  });
}

function initSportFilter() {
  const row = document.getElementById('sc-sport-row');
  SPORT_TYPES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sc-sport-btn' + (s === 'All' ? ' on' : '');
    btn.textContent = (SPORT_ICONS[s] || '') + ' ' + s;
    btn.setAttribute('aria-label', 'Filter: ' + s);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sc-sport-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      activeSport = s;
      if (activeCity)        renderCityResults(activeCity);
      else if (activeMon !== null) renderMonthResults();
    });
    row.appendChild(btn);
  });
}

function filterBySport(events) {
  if (activeSport === 'All') return events;
  return events.filter(e => e.sport === activeSport);
}

function cardHTML(e, labelOverride) {
  const isLink = !!e.guide;
  const tag  = isLink ? 'a' : 'div';
  const attr = isLink ? ` href="${e.guide}"` : '';
  const displayCity = labelOverride || e.city;
  return `<${tag}${attr} class="sc-card${e.guide ? '' : ' sc-no-guide'}">
    <div class="sc-card-top">
      <span class="sc-city">${displayCity}</span>
      <span class="sc-flag-country">${e.flag}<br>${e.country}</span>
    </div>
    <div class="sc-sport-tag">${SPORT_ICONS[e.sport] || ''} ${e.sport}</div>
    <div class="sc-event-name">${e.name}</div>
    <div class="sc-dates">📅 ${e.dates}</div>
    <div class="sc-desc">${e.desc}</div>
  </${tag}>`;
}

function renderMonthResults() {
  const all    = SE_EVENTS.filter(e => e.months.includes(activeMon));
  const events = filterBySport(all);
  const res    = document.getElementById('sc-results');
  let html     = `<div class="sc-section-head">
    <span class="sc-section-title">Sporting Events in ${MONTH_FULL[activeMon]}</span>
    <span class="sc-section-count">${events.length} event${events.length !== 1 ? 's' : ''}</span>
  </div>`;
  if (!events.length) {
    html += `<p class="sc-none">No major events curated for this month${activeSport !== 'All' ? ' in ' + activeSport : ''} yet.</p>`;
  } else {
    html += `<div class="sc-grid">` + events.map(e => cardHTML(e)).join('') + `</div>`;
  }
  res.innerHTML = html;
}

function renderCityResults(cityName) {
  const lower   = cityName.toLowerCase();
  const all     = SE_EVENTS.filter(e => e.city.toLowerCase() === lower);
  const matched = filterBySport(all);
  const res     = document.getElementById('sc-results');
  if (!matched.length) {
    res.innerHTML = `<div class="empty-state"><span class="empty-state-icon">🔍</span>No events found for "${cityName}"${activeSport !== 'All' ? ' in ' + activeSport : ''}.</div>`;
    return;
  }
  const months = [...new Set(matched.flatMap(e => e.months))].sort((a,b)=>a-b);
  let html = `<div class="sc-section-head">
    <span class="sc-section-title">Sporting Events in ${cityName}</span>
    <span class="sc-section-count">${matched.length} event${matched.length !== 1 ? 's' : ''}</span>
  </div><div class="sc-grid">`;
  months.forEach(mon => {
    matched.filter(e => e.months.includes(mon)).forEach(e => {
      html += cardHTML(e, MONTH_FULL[mon]);
    });
  });
  html += `</div>`;
  res.innerHTML = html;
}

initMonths();
initSportFilter();

if (window.TVESearch) {
  const inp = document.getElementById('sc-city-search');
  if (inp) {
    const seen = new Set();
    const tveItems = SE_EVENTS
      .filter(e => { if (seen.has(e.city)) return false; seen.add(e.city); return true; })
      .map(e => ({ name: e.city, sub: e.country }));
    TVESearch.attach(inp, {
      items: tveItems,
      onPick: function(it) {
        document.querySelectorAll('.sc-mon').forEach(b => b.classList.remove('on'));
        activeMon  = null;
        activeCity = it.name;
        renderCityResults(it.name);
      }
    });
    inp.addEventListener('input', function() {
      if (inp.value === '') {
        activeCity = null;
        document.getElementById('sc-results').innerHTML =
          `<div class="empty-state"><span class="empty-state-icon">🏟️</span>Search a city above, or select a month to browse sporting events.</div>`;
      }
    });
  }
}
</script>
</body>
</html>
