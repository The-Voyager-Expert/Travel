<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/assets/web-travel-style.css">
<title>Day Trips by Train — Guide My Days</title>
<style>
/* ── Stats bar ────────────────────────────────────── */
.dt-stats {
  font-size: 13px;
  color: var(--muted, #6a6660);
  margin-bottom: 22px;
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
}
.dt-stats b { color: var(--text, #3d3a32); font-weight: 650; }

/* ── City group ───────────────────────────────────── */
.dt-city {
  border: 1px solid var(--border2, #e6e2da);
  border-radius: 10px;
  margin-bottom: 10px;
  background: var(--surface, #ffffff);
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(92,61,17,.05);
}
.dt-city-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: background .15s;
}
.dt-city-head:hover { background: rgba(184,92,42,.04); }
.dt-city.open .dt-city-head {
  border-bottom-color: var(--border2, #e6e2da);
  background: rgba(184,92,42,.04);
}
.dt-city-name {
  font-weight: 700;
  font-size: 15.5px;
  color: var(--text, #3d3a32);
  flex: 1;
}
.dt-city-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted, #6a6660);
  background: var(--bg, #f5f3ee);
  border: 1px solid var(--border2, #e6e2da);
  border-radius: 99px;
  padding: 2px 10px;
  letter-spacing: 0.02em;
}
.dt-city-arrow {
  color: var(--muted, #6a6660);
  font-size: 12px;
  transition: transform .2s;
  opacity: .5;
}
.dt-city.open .dt-city-arrow { transform: rotate(90deg); opacity: .8; }
.dt-guide-link {
  font-size: 12px;
  color: var(--muted, #6a6660);
  text-decoration: none;
  padding: 3px 10px;
  border: 1px solid var(--border2, #e6e2da);
  border-radius: 5px;
  white-space: nowrap;
  font-weight: 500;
  transition: border-color .15s, color .15s, background .15s;
}
.dt-guide-link:hover { background: var(--bg,#f5f4f0); border-color: var(--rust,#b85c2a); }
.dt-guide-link:visited { color: #6a6660; }

/* ── Trip entries ─────────────────────────────────── */
.dt-trips { padding: 0 20px 16px; display: none; }
.dt-city.open .dt-trips { display: block; }

.dt-trip {
  padding: 14px 0;
  border-bottom: 1px solid var(--border, #eae7e0);
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.dt-trip:last-child { border-bottom: none; }

.dt-trip-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.dt-dest {
  font-weight: 700;
  font-size: 15px;
  color: var(--text, #3d3a32);
}
.dt-time {
  font-size: 11px;
  font-weight: 600;
  color: var(--rust,#b85c2a);
  white-space: nowrap;
  background: rgba(184,92,42,.07);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.02em;
}
.dt-desc {
  font-size: 13.5px;
  color: var(--text, #3d3a32);
  line-height: 1.6;
  margin: 0;
}
.dt-book {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
  align-items: center;
}
.dt-book-link {
  font-size: 12px;
  color: var(--muted, #6a6660);
  text-decoration: none;
  padding: 3px 10px;
  border: 1px solid var(--border2, #e6e2da);
  border-radius: 5px;
  font-weight: 500;
  background: var(--surface, #fff);
  transition: border-color .15s, color .15s, background .15s;
}
.dt-book-link:hover { border-color: var(--rust,#b85c2a); background: var(--bg,#f5f4f0); }
.dt-book-link:visited { color: #6a6660; }
.dt-book-prefix { font-size: 12px; color: var(--muted, #6a6660); }

/* ── Mobile ───────────────────────────────────────── */
@media (max-width: 600px) {
  .dt-city-head { padding: 12px 14px; }
  .dt-trips { padding: 0 14px 12px; }
}
</style>
<link rel="stylesheet" href="/assets/mobile.css">
</head>
<body>

<div class="wrap">

<div id="toolbar-mount" data-depth="1" data-maxwidth="900" data-updated="2026-08-16"></div>
<script src="/assets/toolbar.js?v=103"></script>

<div class="page-header"><h1>DAY TRIPS BY TRAIN</h1></div>

<div class="page-intro-card">
  <div class="page-intro-icon">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="var(--rust,#b85c2a)" aria-hidden="true">
      <path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20v1h12v-1l-1.5-1c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4zm0 2c3.71 0 5.13.46 5.67 1H6.43C6.99 4.46 8.29 4 12 4zm-5.5 8.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5S5 14.83 5 14s.67-1.5 1.5-1.5zm11 0c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5S16 14.83 16 14s.67-1.5 1.5-1.5zM6 7h12v5H6V7z"/>
    </svg>
  </div>
  <div>
    <div class="page-intro-head">Train day trips from every guide</div>
    <div class="page-intro-sub">Organized by departure city. Tap a city to see where you can go and how long it takes.</div>
  </div>
</div>

<div style="display:flex; justify-content:center; margin:0 0 18px;">
  <input type="search" id="dt-search" class="search-input" placeholder="Departure city" aria-label="Search by departure city" autocomplete="off" spellcheck="false" style="width:360px;">
</div>

<div class="dt-stats" id="dt-stats"></div>

<div id="dt-list"></div>

</div>

<div class="also-strip" id="also-on-this-site">
  <div class="also-strip-head">Also on this site</div>
  <div class="also-links">
    <a class="also-on-this-site-pill" href="/essentials/european-trains/index.html">🚆 European train guide</a>
    <a class="also-on-this-site-pill" href="/essentials/scenic-trains/index.html">🚂 Scenic train journeys</a>
    <a class="also-on-this-site-pill" href="/essentials/transit-cards/index.html">🚇 City transit cards</a>
    <a class="also-on-this-site-pill" href="/essentials/storage/index.html">🧳 Luggage storage</a>
    <a class="also-on-this-site-pill" href="/essentials/budget/index.html">💰 Budget guide</a>
  </div>
</div>

<script>
const DATA = [];

const list = document.getElementById('dt-list');
const stats = document.getElementById('dt-stats');
const search = document.getElementById('dt-search');
let openCity = null;

function renderStats(visible) {
  const trips = visible.reduce((s, c) => s + c.trips.length, 0);
  stats.innerHTML = `<span><b>${visible.length}</b> departure cities</span><span><b>${trips}</b> day trips</span>`;
}

function buildBook(book) {
  if (!book || !book.length) return '';
  const links = book.map(b =>
    `<a class="dt-book-link" href="${b.url}" target="_blank" rel="noopener">${b.label}</a>`
  ).join('');
  return `<div class="dt-book"><span class="dt-book-prefix">🎫</span>${links}</div>`;
}

function buildTrips(trips) {
  return trips.map(t => `
    <div class="dt-trip">
      <div class="dt-trip-head">
        <span class="dt-dest">${t.dest}</span>
        ${t.time ? `<span class="dt-time">${t.time}</span>` : ''}
      </div>
      <p class="dt-desc">${t.desc}</p>
      ${buildBook(t.book)}
    </div>
  `).join('');
}

function render(cities) {
  if (!cities.length) {
    list.innerHTML = '<div class="empty-state"><span class="empty-state-icon">🔍</span><div class="empty-state-text">No cities match that search.</div></div>';
    renderStats([]);
    return;
  }
  renderStats(cities);
  list.innerHTML = cities.map((c, i) => `
    <div class="dt-city" data-idx="${i}" data-city="${c.city.toLowerCase()}">
      <div class="dt-city-head" role="button" aria-expanded="false" tabindex="0">
        <span class="dt-city-name">${c.city}</span>
        <span class="dt-city-count">${c.trips.length} trip${c.trips.length !== 1 ? 's' : ''}</span>
        <a class="dt-guide-link" href="${c.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Guide</a>
        <span class="dt-city-arrow">▶</span>
      </div>
      <div class="dt-trips">${buildTrips(c.trips)}</div>
    </div>
  `).join('');

  list.querySelectorAll('.dt-city-head').forEach(head => {
    head.addEventListener('click', () => toggleCity(head.closest('.dt-city')));
    head.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCity(head.closest('.dt-city')); }});
  });
}

function toggleCity(el) {
  const isOpen = el.classList.contains('open');
  list.querySelectorAll('.dt-city.open').forEach(o => {
    o.classList.remove('open');
    o.querySelector('.dt-city-head').setAttribute('aria-expanded', 'false');
  });
  if (!isOpen) {
    el.classList.add('open');
    el.querySelector('.dt-city-head').setAttribute('aria-expanded', 'true');
  }
}

function filter(q) {
  const lower = q.toLowerCase().trim();
  const visible = lower ? DATA.filter(c => c.city.toLowerCase().includes(lower)) : DATA;
  render(visible);
  if (lower && visible.length === 1) toggleCity(list.querySelector('.dt-city'));
}

search.addEventListener('input', () => filter(search.value));

// Initial render
render(DATA);
</script>
<script src="/assets/search-autocomplete.js?v=8"></script>
<script>(function(){
  if(!window.TVESearch) return;
  var input = document.getElementById('dt-search');
  if(!input) return;
  var items = DATA.map(function(c){ return {name:c.city}; });
  TVESearch.attach(input, {items:items});
}());</script>

</body>
</html>
