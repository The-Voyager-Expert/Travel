<style>/* ── Tipping norm palette ── */
:root {
  --c-expected:    #5eb833;
  --c-appreciated: #4a90e2;
  --c-check:       #f5c518;
  --c-skip:        #c8c0b4;
}
/* ── Stat bar ── */
.stat-bar {
  display: flex; flex-wrap: wrap; gap: 0;
  margin: 0 0 16px;
  background: var(--rule,#D2CDCA);
  border: 1px solid var(--rule,#D2CDCA);
  border-radius: 8px; overflow: hidden;
}
.stat-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; flex: 1 1 auto;
  background: var(--surface); border: none;
  font-size: 12px; color: var(--text); white-space: nowrap;
}
.stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.stat-dot.expected    { background: var(--c-expected); }
.stat-dot.appreciated { background: var(--c-appreciated); }
.stat-dot.check       { background: var(--c-check); }
.stat-dot.skip        { background: var(--c-skip); }
.stat-label { color: var(--sub,#7A7368); }
.stat-count { font-weight: 700; }
.stat-pill-expected    { background:#f4fbf0; }
.stat-pill-appreciated { background:#f0f4fb; }
.stat-pill-check       { background:#fdfbee; }
.stat-pill-skip        { background: var(--surface); }
/* ── Filter pills ── */
.controls { margin-bottom: 20px; }
.pills { display: flex; gap: 0; flex-wrap: wrap; }
#region-pills.pills {
  background: var(--rule,#D2CDCA);
  border: 1px solid var(--rule,#D2CDCA);
  border-radius: 8px; overflow: hidden;
}
.pill {
  display: inline-flex; align-items: center; justify-content: center;
  flex: 1 1 auto; height: 36px;
  padding: 0 14px; border: none;
  background: var(--surface,#fff);
  font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1;
  color: var(--text,#2C2822);
  cursor: pointer; transition: background .12s, color .12s; white-space: nowrap;
}
a.pill:visited { color: var(--text,#2C2822); }
.pill:hover { background: var(--surface-alt,#F7F4EE); }
.pill.active,
.pill.active:hover,
.pill.active:focus { background: var(--brand,#C04E1A); color: #fff; }
/* ── Region headers (B — hairline rule) ── */
.region-header {
  display: flex; align-items: center; gap: 12px;
  margin: 28px 0 0; padding: 0;
  background: none; border: none; border-radius: 0;
  color: var(--sub,#7A7368); font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
}
.region-header::before, .region-header::after {
  content: ''; flex: 1; height: 1px; background: var(--rule2,#e6e2da);
}
.region-header:first-child { margin-top: 0; }
/* ── Card groups (connected hairline grid) ── */
.card-group {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--rule,#D2CDCA);
  border: 1px solid var(--rule,#D2CDCA);
  border-radius: 8px; overflow: hidden;
  margin-top: 12px;
}
/* ── Country cards ── */
.country-row {
  background: var(--surface);
  border: none; border-radius: 0; margin: 0;
  padding: 14px 16px 14px 20px;
  display: grid;
  grid-template-columns: 210px auto;
  gap: 0 24px;
  position: relative;
  transition: background .12s;
}
.country-row::before {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0;
  width: 4px; border-radius: 0;
}
.country-row.norm-expected::before    { background: var(--c-expected); }
.country-row.norm-appreciated::before { background: var(--c-appreciated); }
.country-row.norm-check::before       { background: var(--c-check); }
.country-row.norm-skip::before        { background: var(--c-skip); }
.country-row:hover { background: var(--surface-alt,#F7F4EE); }
.country-left { display: flex; flex-direction: column; justify-content: flex-start; }
/* .country-name canonical place+color+size+font now shared in web-travel-style.css + mobile.css (owner rule 2026-07-29) */
.country-name { display: flex; align-items: center; gap: 7px; line-height: 1.2; }
.country-flag { font-size: 18px; line-height: 1; }
.country-cities { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.55; }
.country-right { }
.tip-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.norm-chip {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px; letter-spacing: .04em;
  text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
}
.norm-chip.expected    { background: #e8f5e8; color: #1a5a1a; border: 1px solid rgba(26,90,26,0.4); }
.norm-chip.appreciated { background: #e8f0fb; color: var(--navy); border: 1px solid rgba(26,58,139,0.4); }
.norm-chip.check       { background: #fff8e0; color: #7a5800; border: 1px solid rgba(122,88,0,0.4); }
.norm-chip.skip        { background: rgba(138,108,26,0.07); color: var(--muted); border: 1px solid var(--border2, #e6e2da); }
.tip-rows { display: flex; flex-direction: column; gap: 4px; }
.tip-row  {
  font-size: 12.5px; color: var(--text);
  display: flex; gap: 8px;
  padding: 3px 0;
  border-bottom: 1px solid #f0ede8;
}
.tip-row:last-child { border-bottom: none; }
.tip-label { color: var(--muted); flex-shrink: 0; width: 140px; }
.tip-value { color: var(--text); font-weight: 500; }
.tip-note  { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
/* .empty-state lives in web-travel-style.css (shared) */
/* ── Mobile ── */
@media (max-width: 600px) and (pointer: coarse) {
  /* Horizontal bleed comes from the shared rule — (100vw - 100%)/2 off the .wrap
     gutter. Restating it as a number here made the band stop short of the edge. */
  .hero-band { padding-top: 32px; padding-bottom: 28px; }
  .hero-title { font-size: 32px; }
  /* No phone override: the gap above and below the search is one token
     (--search-gap) at every viewport — owner rule 2026-08-17. */
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .pill { white-space: normal; text-align: center; height: 40px; font-size: 11.5px; padding: 4px 6px; border-radius: 0; line-height: 1.12; }
  .pill.active, .pill.active:hover, .pill.active:focus { background: var(--brand,#C04E1A); color: #fff; }
  .stat-bar { display: grid; grid-template-columns: repeat(2, 1fr); }
  .stat-pill { font-size: 11.5px; padding: 4px 6px; height: 40px; border-radius: 0; justify-content: center; }
  .country-row { grid-template-columns: 1fr; gap: 12px; padding: 13px 14px 13px 18px; }
  .tip-label { width: 120px; }
}
@media (prefers-color-scheme: dark) {
  #region-pills.pills .pill { color: var(--text); }
  .stat-pill-expected    { background: #0a1e0a; color: #4aaa4a; border-color: rgba(74,170,74,0.4); }
  .stat-pill-appreciated { background: #0a1e3a; color: #5a9aee; border-color: rgba(90,154,238,0.4); }
  .stat-pill-check       { background: #2a2000; color: #c8a040; border-color: rgba(200,160,64,0.4); }
  .norm-chip.expected    { background: #0a1e0a; color: #4aaa4a; border-color: rgba(74,170,74,0.4); }
  .norm-chip.appreciated { background: #0a1e3a; color: #5a9aee; border-color: rgba(90,154,238,0.4); }
  .norm-chip.check       { background: #2a2000; color: #c8a040; border-color: rgba(200,160,64,0.4); }
}
:root[data-theme="dark"] .stat-pill-expected    { background: #0a1e0a; color: #4aaa4a; }
:root[data-theme="dark"] .stat-pill-appreciated { background: #0a1e3a; color: #5a9aee; }
:root[data-theme="dark"] .stat-pill-check       { background: #2a2000; color: #c8a040; }
:root[data-theme="dark"] .norm-chip.expected    { background: #0a1e0a; color: #4aaa4a; border-color: rgba(74,170,74,0.4); }
:root[data-theme="dark"] .norm-chip.appreciated { background: #0a1e3a; color: #5a9aee; border-color: rgba(90,154,238,0.4); }
:root[data-theme="dark"] .norm-chip.check       { background: #2a2000; color: #c8a040; border-color: rgba(200,160,64,0.4); }

  other: 'Middle East & Africa'
};
var REGION_ORDER = ['americas','caribbean','europe','asiapac','other'];

function norm(n) {
  var map = {expected:'Expected', appreciated:'Appreciated', check:'Check Bill', skip:'Not Customary'};
  return map[n] || n;
}

function buildStatBar() {
  var counts = {expected:0, appreciated:0, check:0, skip:0};
  COUNTRIES.forEach(function(c) { if (counts[c.norm] !== undefined) counts[c.norm]++; });
  var labels = {expected:'Expected', appreciated:'Appreciated', check:'Check Bill', skip:'Not Customary'};
  var html = '';
  ['expected','appreciated','check','skip'].forEach(function(k) {
    html += '<div class="stat-pill stat-pill-' + k + '">' +
      '<span class="stat-dot ' + k + '"></span>' +
      '<span class="stat-label">' + labels[k] + '</span>' +
      '<span class="stat-count">' + counts[k] + '</span>' +
    '</div>';
  });
  document.getElementById('stat-bar').innerHTML = html;
}

function renderCard(c) {
  var tipRows = c.tips.map(function(t) {
    return '<div class="tip-row"><span class="tip-label">' + t.label + '</span><span class="tip-value">' + t.value + '</span></div>';
  }).join('');
  return '<div class="country-row norm-' + c.norm + '">' +
    '<div class="country-left">' +
      '<div class="country-name"><span class="country-flag">' + c.flag + '</span>' + c.name + '</div>' +
      '<div class="country-cities">' + c.cities + '</div>' +
    '</div>' +
    '<div class="country-right">' +
      '<div class="tip-header"><span class="norm-chip ' + c.norm + '">' + norm(c.norm) + '</span></div>' +
      '<div class="tip-rows">' + tipRows + '</div>' +
      (c.note ? '<div class="tip-note">' + c.note + '</div>' : '') +
    '</div>' +
  '</div>';
}

function render() {
  var list = document.getElementById('list');
  var filtered = COUNTRIES.filter(function(c) {
    if (activeRegion !== 'all' && c.region !== activeRegion) return false;
    if (searchVal && (c.name + ' ' + c.cities).toLowerCase().indexOf(searchVal) === -1) return false;
    return true;
  });
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No results for "' + searchVal + '"</div>';
    return;
  }

  // Group by region in canonical order (only regions that appear in filtered set)
  var grouped = {};
  filtered.forEach(function(c) {
    if (!grouped[c.region]) grouped[c.region] = [];
    grouped[c.region].push(c);
  });

  var html = '';
  var regions = activeRegion === 'all'
    ? REGION_ORDER.filter(function(r) { return grouped[r]; })
    : [activeRegion];

  regions.forEach(function(r) {
    if (!grouped[r]) return;
    if (activeRegion === 'all' || searchVal) {
      html += '<div class="region-header">' + REGION_LABELS[r] + '</div>';
    }
    html += '<div class="card-group">' + grouped[r].map(renderCard).join('') + '</div>';
  });

  list.innerHTML = html;
}

document.getElementById('region-pills').addEventListener('click', function(e) {
  var btn = e.target.closest('.pill');
  if (!btn) return;
  activeRegion = btn.dataset.region;
  document.querySelectorAll('.pill').forEach(function(p) { p.classList.remove('active'); });
  btn.classList.add('active');
  render();
});

document.getElementById('search').addEventListener('input', function(e) {
  searchVal = e.target.value.toLowerCase().trim();
  render();
});

buildStatBar();
render();
</script>

<script src="/assets/search-autocomplete.js?v=8"></script>
<script>(function(){
  if(!window.TVESearch) return;
  var input=document.getElementById('search'); if(!input) return;
  var list=window.COUNTRIES||[];
  var items=list.map(function(c){ return {name:c.name, text:c.cities||''}; });
  TVESearch.attach(input,{items:items});
}());</script>
</body>
